# PostgreSQL local para desenvolvimento. Credenciais vem de variaveis (ver .env.example); nada fixo aqui.
# Porta do host 5440 para nao colidir com um PostgreSQL instalado na maquina (5432).
# Dados persistem no volume nomeado regulacheck-pgdata (nao use "down -v" se quiser preserva-los).
services:
  postgres:
    image: postgres:18.6
    container_name: regulacheck-postgres
    environment:
      POSTGRES_DB: regulacheck
      POSTGRES_USER: ${DB_USERNAME:-regulacheck}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no shell}
    ports:
      - "127.0.0.1:5440:5432"
    volumes:
      - regulacheck-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d regulacheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  regulacheck-pgdata:
