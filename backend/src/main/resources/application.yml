spring:
  application:
    name: regulacheck-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/regulacheck}
    username: ${DB_USERNAME:regulacheck}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Esquema gerenciado por scripts em database/scripts; o Hibernate nunca altera o banco.
      ddl-auto: none

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
