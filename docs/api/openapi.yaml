  /solicitacoes/{id}/sessoes-captura:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    post:
      tags: [Estação de captura]
      summary: Abre a sessão de captura do pedido próprio (RC-21; estação de captura SIMULADA)
      description: >
        Sem corpo. No máximo uma sessão aberta por pedido; se já houver, devolve a existente (200) sem gravar nada,
        inclusive em toques duplicados ou chamadas simultâneas. Não muda estado, revisão nem documentos do pedido.
        Ordem 401, 403 (administrador ou chave do simulador), 404, 409 (pedido submetido), 201 ou 200.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Sessão criada agora
          headers:
            Location: { description: "/solicitacoes/{id}/leituras", schema: { type: string } }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessaoCaptura" }
        "200":
          description: O pedido já tinha sessão aberta; ela é devolvida com criada=false
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessaoCaptura" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: CONFLITO_ESTADO (pedido submetido em simulação; só consulta)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}/leituras:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    get:
      tags: [Estação de captura]
      summary: Telemetria dos dois sensores simulados do pedido próprio, com orientação (RC-22)
      description: >
        Sempre os dois sensores (luminosidade, distância), com a última leitura da sessão mais recente, a situação e a
        orientação. Faixas demonstrativas (300 a 1000 lux, 20 a 40 cm, sem calibração); leitura medida há mais de
        60 s é DESATUALIZADA. Sem sessão ou sem leitura, 200 com SEM_LEITURA. As leituras não comprovam a
        legibilidade do arquivo e não bloqueiam envio de documentos.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Telemetria
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Telemetria" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /sessoes-captura/{id}/leituras:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    post:
      tags: [Estação de captura]
      summary: O simulador envia uma leitura de sensor (RC-21; só a chave do simulador)
      description: >
        Uma leitura por requisição. Ordem 401 (sem chave ou chave errada), 403 (conta de paciente ou administrador),
        404 (sessão inexistente ou encerrada, conferida antes de ler o corpo), 415 ou 400 de formato, 400 de
        conteúdo, 201. Valor fora da faixa demonstrativa não é erro.
      security:
        - chaveSimulador: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LeituraSensorEnvio" }
      responses:
        "201":
          description: Leitura gravada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeituraSensorGravada" }
        "400":
          description: REQUISICAO_INVALIDA (detalhes[].campo em sessaoId, tipo, unidade, valor, medidaEm ou corpo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404":
          description: Sessão de captura inexistente ou encerrada (NAO_ENCONTRADO, resposta idêntica)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "415":
          description: TIPO_NAO_SUPORTADO (corpo não é application/json)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
