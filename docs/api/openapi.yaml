openapi: 3.0.3
info:
  title: RegulaCheck API (acadêmica, dados sintéticos)
  version: 0.7.0
  description: >
    Documentação escrita à mão. Proteções (RC-06): toda resposta traz X-Content-Type-Options nosniff,
    Cache-Control no-store, Content-Security-Policy restritiva e Referrer-Policy no-referrer; textos
    derivados de entrada saem como texto puro (esquema TextoSimulado). As regras de arquivo (tipo real,
    extensão, 5 MB, 5 páginas, 3 arquivos) e o download seguro estão em docs/api/protecoes.md; desde a
    RC-08 são usadas pelas rotas de documentos do pedido (envio, lista e download).
    Demais notas: Nesta etapa estão implementados GET /health, GET /protocolos, o rascunho de solicitação (GET/POST /solicitacoes e GET/PUT /solicitacoes/{id}, RC-07), os documentos do pedido (POST/GET /solicitacoes/{id}/documentos e GET /solicitacoes/{id}/documentos/{docId}, RC-08), remover e substituir documento (DELETE e PUT /solicitacoes/{id}/documentos/{docId}) e excluir rascunho com confirmação (DELETE /solicitacoes/{id}, RC-09) e as rotas de
    autenticação POST /auth/login, GET /auth/sessao e POST /auth/logout (RC-04); os demais
    caminhos estão em CONTRATO_API.md e nos contratos Markdown. As rotas de autenticação
    dependem do banco Oracle: sem DB_* configuradas respondem 503. Autorização (RC-05): 401 sem
    identidade válida, 403 perfil sem permissão, 404 recurso inexistente ou de outra paciente
    (resposta idêntica), nessa ordem; a tabela de perfis por rota está em CONTRATO_API.md. O
    sistema não diagnostica, não define urgência nem autoriza atendimento.
servers:
  - url: http://localhost:8080
    description: Computador de desenvolvimento
  - url: http://10.0.2.2:8080
    description: Emulador Android apontando para o computador
paths:
  /health:
    get:
      summary: Estado técnico da API
      responses:
        "200":
          description: API em execução
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saude"
        "404":
          description: Rota inexistente em outras URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /auth/login:
    post:
      summary: Autentica a conta e abre uma sessão
      description: >
        Senha errada, e-mail inexistente, conta desativada e senha acima de 72 bytes devolvem a
        mesma resposta 401. O token só aparece nesta resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sessão aberta (prazo padrão de 30 minutos)
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Corpo ilegível, ou e-mail/senha ausentes ou fora do tamanho (REQUISICAO_INVALIDA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "401":
          description: Credenciais inválidas (CREDENCIAIS_INVALIDAS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "415":
          description: Content-Type diferente de application/json (TIPO_NAO_SUPORTADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "503":
          description: Banco indisponível ou não configurado (DEPENDENCIA_INDISPONIVEL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /auth/sessao:
    get:
      summary: Identidade e expiração da sessão atual
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessão válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessaoResponse"
        "401":
          description: >
            Token ausente, malformado, desconhecido, expirado ou encerrado, ou conta desativada
            (NAO_AUTENTICADO); a resposta é a mesma em todos os casos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "403":
          description: Chave do simulador apresentada em rota de conta (ACESSO_NEGADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "503":
          description: Banco indisponível (DEPENDENCIA_INDISPONIVEL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /auth/logout:
    post:
      summary: Encerra a sessão do token enviado
      description: As outras sessões da mesma conta continuam válidas. Repetir com o mesmo token devolve 401.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sessão encerrada; o token deixa de valer imediatamente
        "401":
          description: Sessão ausente, expirada ou já encerrada (NAO_AUTENTICADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "403":
          description: Chave do simulador apresentada em rota de conta (ACESSO_NEGADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "503":
          description: Banco indisponível (DEPENDENCIA_INDISPONIVEL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /protocolos:
    get:
      summary: Serviços (protocolos acadêmicos fictícios) ativos que a paciente pode escolher (RC-07)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Serviços ativos; `itens` vazio quando não há nenhum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaProtocolos"
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes:
    get:
      summary: Lista os pedidos da paciente da sessão (RC-07)
      description: Só os pedidos próprios, do mais recente ao mais antigo, no máximo 50 (sem paginação).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pedidos da paciente; `itens` vazio se não tiver nenhum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaSolicitacoes"
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    post:
      summary: Cria um rascunho ligado ao serviço escolhido (RC-07)
      description: >
        A paciente é a da sessão; campos extras (dono, estado, revisão) são ignorados. Cada chamada
        bem-sucedida cria um pedido novo (sem deduplicação).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitacaoRequest"
      responses:
        "201":
          description: Rascunho criado na revisão 1
          headers:
            Location:
              schema: { type: string, example: /solicitacoes/12 }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitacao"
        "400":
          description: Corpo ou `protocoloId` inválido (REQUISICAO_INVALIDA, com `detalhes[].campo`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "415":
          description: Corpo que não é application/json (TIPO_NAO_SUPORTADO)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: Serviço inexistente ou inativo (REGRA_DE_NEGOCIO, campo `protocoloId`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Número decimal positivo devolvido pela criação; outro formato responde 404.
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    get:
      summary: Reabre um pedido próprio (RC-07)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dados persistidos do pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitacao"
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    put:
      summary: Troca o serviço de um rascunho (RC-07)
      description: >
        Só em RASCUNHO. Serviço diferente: revisão +1, `atualizadaEm` atualizado e revisão registrada com o
        motivo PROTOCOLO_ALTERADO. Mesmo serviço: 200 sem alterar nada. A dona é conferida antes do corpo.
        Alterações simultâneas do mesmo rascunho são serializadas.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitacaoRequest"
      responses:
        "200":
          description: Pedido no estado final
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitacao"
        "400":
          description: Corpo ou `protocoloId` inválido (REQUISICAO_INVALIDA)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: O pedido já saiu de RASCUNHO (CONFLITO_ESTADO)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "415":
          description: Corpo que não é application/json (TIPO_NAO_SUPORTADO)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: Serviço inexistente ou inativo (REGRA_DE_NEGOCIO, campo `protocoloId`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    delete:
      summary: Exclui um rascunho próprio, com confirmação explícita (RC-09)
      description: >
        Exige o cabeçalho `X-Confirmar-Exclusao: EXCLUIR` (valor exato). Sem ele, ou com outro valor, responde 400
        (detalhe `confirmacao`) e nada é apagado. Só em RASCUNHO. Numa única transação apaga os documentos
        (disponíveis e removidos), as revisões e o pedido; os arquivos guardados são apagados depois do commit. Ordem:
        dona (404), confirmação (400), estado (409). Não há lixeira nem desfazer.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Confirmar-Exclusao
          in: header
          required: true
          description: Confirmação deliberada da exclusão irreversível; o único valor aceito é `EXCLUIR`.
          schema: { type: string, enum: [EXCLUIR] }
      responses:
        "204":
          description: Pedido, revisões, documentos e arquivos apagados (sem corpo)
        "400":
          description: Confirmação ausente, em branco ou diferente de `EXCLUIR` (REQUISICAO_INVALIDA, campo `confirmacao`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: >
            CONFLITO_ESTADO: pedido submetido em simulação ("Este pedido já foi submetido e só pode ser consultado."),
            pedido fora de RASCUNHO ("Somente rascunhos podem ser excluídos.") ou algo ainda ligado ao pedido
            ("Este pedido não pode ser excluído."); nada é apagado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}/documentos:
    parameters:
      - name: id
        in: path
        required: true
        description: Número decimal positivo do pedido; outro formato responde 404.
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    get:
      summary: Lista os documentos disponíveis do pedido próprio (RC-08)
      description: Na ordem de envio, no máximo 3. Lista vazia é 200.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documentos do pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDocumentos" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    post:
      summary: Envia um arquivo ao rascunho do pedido (RC-08)
      description: >
        Um arquivo por requisição, só em RASCUNHO. O formato é decidido pelo conteúdo (PDF, JPEG ou PNG), nunca
        pela extensão ou pelo tipo declarado. Cada envio novo cria a revisão seguinte (motivo DOCUMENTO_ENVIADO) e
        não inicia análise. Com `X-Chave-Envio`, repetir o mesmo envio (mesmo conteúdo e tipo documental) devolve o
        documento existente com 200, sem gravar nada. Recusa não persiste nada. A dona é conferida antes do corpo.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Chave-Envio
          in: header
          required: false
          description: Identificação da tentativa, 8 a 64 caracteres [A-Za-z0-9_-]; válida por pedido.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, tipoDocumental]
              properties:
                arquivo: { type: string, format: binary, description: "PDF (até 5 páginas), JPEG ou PNG, até 5 MB" }
                tipoDocumental: { $ref: "#/components/schemas/TipoDocumental" }
      responses:
        "200":
          description: Repetição da mesma tentativa; documento já existente (nada novo foi gravado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoEnviado" }
        "201":
          description: Documento novo gravado, revisão do pedido incrementada
          headers:
            Location:
              schema: { type: string, example: /solicitacoes/12/documentos/41 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoEnviado" }
        "400":
          description: >
            REQUISICAO_INVALIDA com `detalhes[].campo` = tipoDocumental, arquivo, arquivos ou chaveEnvio; PDF com mais
            de 5 páginas, protegido por senha ou ilegível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: CONFLITO_ESTADO (pedido fora de RASCUNHO) ou CHAVE_ENVIO_REUTILIZADA (mesma chave com outro conteúdo ou tipo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "413":
          description: ARQUIVO_MUITO_GRANDE (acima de 5 MB)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "415":
          description: TIPO_NAO_SUPORTADO (corpo que não é multipart/form-data ou conteúdo que não é PDF/JPEG/PNG) ou EXTENSAO_INCOMPATIVEL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: REGRA_DE_NEGOCIO, campo `documentos` (o pedido já tem 3 documentos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}/documentos/{docId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
      - name: docId
        in: path
        required: true
        description: Número decimal positivo devolvido pelo envio; só abre pelo pedido ao qual pertence.
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    get:
      summary: Baixa o arquivo de um documento próprio, como anexo (RC-08)
      description: >
        Conteúdo exatamente como foi guardado. Documento alheio, de outro pedido, inexistente ou id mal formado:
        o mesmo 404. O nome interno de armazenamento nunca aparece.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Arquivo
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="encaminhamento.pdf"' }
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    put:
      summary: Substitui um documento por outro arquivo, numa só operação (RC-09)
      description: >
        Mesmo multipart do envio (`arquivo`, `tipoDocumental`, `X-Chave-Envio` opcional). O documento antigo sai e o
        novo entra na mesma transação, com UMA revisão nova (motivo DOCUMENTO_SUBSTITUIDO); a contagem de documentos
        não muda, então não há erro de limite. O arquivo novo passa pela conferência do envio; recusa ou falha deixa o
        antigo, a versão e os arquivos como estavam. O arquivo antigo é apagado depois do commit. Com `X-Chave-Envio`, a
        repetição é reconhecida ANTES de procurar o `docId` (que, depois do sucesso, já não existe) e responde 200.
        Não inicia análise nem muda o estado; torna não vigente a análise anterior. Pedido em SUBMETIDA_SIMULACAO: 409.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Chave-Envio
          in: header
          required: false
          description: Identificação da tentativa, 8 a 64 caracteres [A-Za-z0-9_-]; vale por pedido, para POST e PUT.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, tipoDocumental]
              properties:
                arquivo: { type: string, format: binary, description: "PDF (até 5 páginas), JPEG ou PNG, até 5 MB" }
                tipoDocumental: { $ref: "#/components/schemas/TipoDocumental" }
      responses:
        "200":
          description: Repetição da mesma tentativa; documento já existente (nada novo foi gravado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoEnviado" }
        "201":
          description: Documento novo no lugar do antigo; `Location` aponta para o documento NOVO
          headers:
            Location:
              schema: { type: string, example: /solicitacoes/12/documentos/42 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoEnviado" }
        "400":
          description: >
            REQUISICAO_INVALIDA com `detalhes[].campo` = tipoDocumental, arquivo, arquivos ou chaveEnvio; PDF com mais
            de 5 páginas, protegido por senha ou ilegível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: >
            CONFLITO_ESTADO (pedido submetido em simulação: "Este pedido já foi submetido e só pode ser consultado.") ou
            CHAVE_ENVIO_REUTILIZADA (mesma chave com outro conteúdo ou tipo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "413":
          description: ARQUIVO_MUITO_GRANDE (acima de 5 MB)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "415":
          description: TIPO_NAO_SUPORTADO (corpo que não é multipart/form-data ou conteúdo que não é PDF/JPEG/PNG) ou EXTENSAO_INCOMPATIVEL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    delete:
      summary: Remove um documento do pedido próprio (RC-09)
      description: >
        Sem corpo. Revisão +1 (motivo DOCUMENTO_REMOVIDO); o documento some da lista e do download, a vaga é liberada e o
        arquivo é apagado depois do commit; o registro fica como histórico. Repetir a remoção é 404 e não muda versão
        nem contagem. Não inicia análise nem muda o estado; torna não vigente a análise anterior. Pedido em
        SUBMETIDA_SIMULACAO: 409.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documento removido; estado novo do conjunto documental
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemocaoDocumento" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: CONFLITO_ESTADO (pedido submetido em simulação; só pode ser consultado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token recebido em POST /auth/login, enviado em Authorization (Bearer).
    chaveSimulador:
      type: apiKey
      in: header
      name: X-Chave-Simulador
      description: >
        Chave do simulador de sensores (variável IOT_API_KEY), válida somente na rota de telemetria
        (planejada). Em qualquer outra rota responde 403; o valor real nunca é versionado.
  responses:
    NaoAutenticado:
      description: Sessão ausente, expirada ou encerrada (NAO_AUTENTICADO)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    AcessoNegado:
      description: Perfil sem permissão, por exemplo administrador ou chave do simulador (ACESSO_NEGADO)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    NaoEncontrado:
      description: Pedido inexistente, de outra paciente ou id inválido (NAO_ENCONTRADO, resposta idêntica)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
    Indisponivel:
      description: Banco indisponível (DEPENDENCIA_INDISPONIVEL)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
  schemas:
    RemocaoDocumento:
      type: object
      description: Estado do conjunto documental depois de remover um documento (RC-09). Não devolve o documento removido.
      required: [versaoConjuntoDocumental, documentosDisponiveis]
      properties:
        versaoConjuntoDocumental: { type: integer, minimum: 2, example: 4 }
        documentosDisponiveis: { type: integer, minimum: 0, maximum: 3, example: 2 }
    Protocolo:
      type: object
      required: [protocoloId, identificador, versao, localidade, especialidade, avisoFicticio, simulacao]
      properties:
        protocoloId: { type: string, example: PROTOCOLO-ACADEMICO-FICTICIO-v0.1 }
        identificador: { type: string, example: PROTOCOLO-ACADEMICO-FICTICIO }
        versao: { type: string, example: v0.1 }
        localidade: { type: string, example: Município Exemplo }
        especialidade: { type: string, example: Consulta ambulatorial em cardiologia }
        avisoFicticio: { type: string }
        simulacao: { type: boolean, enum: [true] }
    ListaProtocolos:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: "#/components/schemas/Protocolo" }
    SolicitacaoRequest:
      type: object
      required: [protocoloId]
      properties:
        protocoloId:
          type: string
          maxLength: 100
          description: Serviço escolhido, valor de `protocoloId` devolvido por GET /protocolos. Deve ser texto JSON.
          example: PROTOCOLO-ACADEMICO-FICTICIO-v0.1
    TipoDocumental:
      type: string
      enum: [ENCAMINHAMENTO, IDENTIFICACAO, AUTORIZACAO_RESPONSAVEL, OUTRO]
      description: O que o arquivo diz ser (informado pela paciente); não prova que o conteúdo corresponde.
    Documento:
      type: object
      required: [id, solicitacaoId, nomeArquivo, tipoDocumental, formato, tamanhoBytes, paginas, estadoEnvio, revisaoEntrada, enviadoEm, simulacao]
      properties:
        id: { type: string, description: Número decimal opaco, example: "41" }
        solicitacaoId: { type: string, example: "12" }
        nomeArquivo: { type: string, description: Nome de exibição saneado (nunca o nome de armazenamento), example: encaminhamento-sintetico.pdf }
        tipoDocumental: { $ref: "#/components/schemas/TipoDocumental" }
        formato: { type: string, enum: [PDF, JPEG, PNG], description: Decidido pelo conteúdo }
        tamanhoBytes: { type: integer, minimum: 1, maximum: 5242880 }
        paginas: { type: integer, minimum: 1, maximum: 5, description: Páginas do PDF; 1 para imagens }
        estadoEnvio:
          type: string
          enum: [ENVIADO]
          description: Estado do envio, não da análise. Novos valores só entram em histórias de processamento.
        revisaoEntrada: { type: integer, minimum: 2 }
        enviadoEm: { type: string, format: date-time }
        simulacao: { type: boolean, enum: [true] }
    DocumentoEnviado:
      allOf:
        - $ref: "#/components/schemas/Documento"
        - type: object
          required: [versaoConjuntoDocumental, documentosDisponiveis]
          properties:
            versaoConjuntoDocumental: { type: integer, minimum: 2, description: Revisão do pedido após o envio }
            documentosDisponiveis: { type: integer, minimum: 1, maximum: 3 }
    ListaDocumentos:
      type: object
      required: [documentos, total, maximo, versaoConjuntoDocumental]
      properties:
        documentos:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Documento" }
        total: { type: integer }
        maximo: { type: integer, example: 3 }
        versaoConjuntoDocumental: { type: integer, minimum: 1 }
    Analise:
      type: object
      required: [situacao, mensagem]
      description: Situação da análise para a versão atual dos documentos. Upload concluído não é análise concluída.
      properties:
        situacao: { type: string, enum: [NAO_REALIZADA], description: Hoje só este valor existe }
        mensagem: { type: string }
    Solicitacao:
      type: object
      required: [id, protocoloId, servico, estado, revisao, criadaEm, atualizadaEm, simulacao, versaoConjuntoDocumental, documentosDisponiveis, analise]
      properties:
        id: { type: string, description: Número decimal opaco, example: "12" }
        protocoloId: { type: string }
        servico:
          type: object
          required: [localidade, especialidade, avisoFicticio]
          properties:
            localidade: { type: string }
            especialidade: { type: string }
            avisoFicticio: { type: string }
        estado:
          type: string
          enum: [RASCUNHO, PROCESSANDO, REQUER_CONFERENCIA, COM_PENDENCIAS, SEM_PENDENCIAS_IDENTIFICADAS, FALHA_ANALISE, SUBMETIDA_SIMULACAO]
          description: Na RC-07 só RASCUNHO é produzido.
        revisao: { type: integer, minimum: 1 }
        criadaEm: { type: string, format: date-time }
        atualizadaEm: { type: string, format: date-time }
        simulacao: { type: boolean, enum: [true] }
        versaoConjuntoDocumental: { type: integer, minimum: 1, description: Igual a `revisao` (RC-08) }
        documentosDisponiveis: { type: integer, minimum: 0, maximum: 3, description: Documentos disponíveis do pedido (RC-08) }
        analise: { $ref: "#/components/schemas/Analise" }
    ListaSolicitacoes:
      type: object
      required: [itens, limite]
      properties:
        itens:
          type: array
          items: { $ref: "#/components/schemas/Solicitacao" }
        limite: { type: integer, example: 50 }
    Saude:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          maxLength: 254
          example: paciente.a@exemplo.invalid
        senha:
          type: string
          description: Até 72 bytes em UTF-8; nunca é registrada em log.
          writeOnly: true
    UsuarioResumo:
      type: object
      required: [nome, perfil]
      properties:
        nome: { type: string, example: Paciente A (fictícia) }
        perfil:
          type: string
          enum: [PACIENTE, ADMINISTRADOR]
    LoginResponse:
      type: object
      required: [token, tipo, expiraEm, usuario]
      properties:
        token:
          type: string
          description: 43 caracteres (base64url); só aparece nesta resposta.
        tipo:
          type: string
          enum: [Bearer]
        expiraEm:
          type: string
          format: date-time
          example: "2026-11-12T22:30:00Z"
        usuario:
          $ref: "#/components/schemas/UsuarioResumo"
    SessaoResponse:
      type: object
      required: [usuario, expiraEm]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioResumo"
        expiraEm:
          type: string
          format: date-time
    Erro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo: { type: string, example: NAO_ENCONTRADO }
        mensagem: { type: string, example: Recurso nao encontrado. }
        idRastreamento: { type: string }
        detalhes:
          type: array
          items:
            type: object
            required: [campo, mensagem]
            properties:
              campo: { type: string }
              mensagem: { type: string }
    TextoSimulado:
      type: object
      description: >
        Texto do resumo simulado (a IA é mockada). Deve ser exibido como texto puro, nunca como HTML;
        o servidor já escapa os caracteres de marcação no JSON.
      required: [texto, simulado, formato]
      properties:
        texto: { type: string }
        simulado: { type: boolean, enum: [true] }
        formato: { type: string, enum: [texto_puro] }
