                        reenviar quando essa ação estiver disponível. Informação não verificável não comprova ausência.
                      evidencias: []
                    resumo:
                      texto: Resumo simulado indisponível. Consulte as pendências por regra e tente gerar o resumo novamente. Nenhuma
                        conclusão adicional foi tirada.
                      origem: PADRAO
                      simulado: true
                      itens:
                      - codigoRegra: RC-R02
                        acao: Não conseguimos ler esta informação no documento enviado. Isso não significa que ela esteja faltando.
                          Envie uma foto ou arquivo mais nítido ou confira a transcrição.
                        responsavel: PACIENTE
                      - codigoRegra: RC-R03
                        acao: Envie um documento de identificação ou o cartão do SUS.
                        responsavel: PACIENTE
                      - codigoRegra: RC-R06
                        acao: Não conseguimos ler esta informação no documento enviado. Isso não significa que ela esteja faltando.
                          Envie uma foto ou arquivo mais nítido ou confira a transcrição.
                        responsavel: PACIENTE
        "200":
          description: Resumo gerado ja existente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnaliseGravada" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: Sem analise vigente ou analise alterada durante a geracao
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}/submissoes-simuladas:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    post:
      tags: [Submissão simulada]
      summary: Conclui a simulação do pedido próprio (RC-17; SIMULAÇÃO ACADÊMICA — NÃO ENVIADO AO SUS)
      description: >
        Sem corpo (ignorado). Exige, sob o bloqueio do pedido, análise vigente da revisão atual com
        SEM_PENDENCIAS_IDENTIFICADAS, sem critério PENDENTE nem NAO_VERIFICAVEL, e o pedido nesse estado; grava a
        submissão simulada e leva o pedido a SUBMETIDA_SIMULACAO (só consulta) na mesma transação. Repetir devolve a
        mesma submissão (200). Nada é enviado ao SUS; não há fila real nem número oficial de protocolo.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Submissão registrada agora
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComprovanteSimulado" }
              example:
                solicitacaoId: '1'
                referencia: SIM-2026-000001
                submetidaEm: '2026-11-12T20:00:00Z'
                simulada: true
                destaque: SIMULAÇÃO ACADÊMICA — NÃO ENVIADO AO SUS
                servico:
                  localidade: Município Exemplo
                  especialidade: Consulta ambulatorial em cardiologia
                  avisoFicticio: Documento acadêmico fictício. Não é exigência oficial de nenhum serviço de saúde ou do SUS.
                versaoAnalisada:
                  analiseId: '2'
                  revisao: 3
                  protocolo:
                    identificador: PROTOCOLO-ACADEMICO-FICTICIO
                    versao: v0.1
                nota: Este comprovante é de demonstração. Não é documento clínico, não é protocolo oficial e não coloca você em
                  fila real.
        "200":
          description: O pedido já tinha submissão; o mesmo comprovante, nada novo registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComprovanteSimulado" }
              example:
                solicitacaoId: '1'
                referencia: SIM-2026-000001
                submetidaEm: '2026-11-12T20:00:00Z'
                simulada: true
                destaque: SIMULAÇÃO ACADÊMICA — NÃO ENVIADO AO SUS
                servico:
                  localidade: Município Exemplo
                  especialidade: Consulta ambulatorial em cardiologia
                  avisoFicticio: Documento acadêmico fictício. Não é exigência oficial de nenhum serviço de saúde ou do SUS.
                versaoAnalisada:
                  analiseId: '2'
                  revisao: 3
                  protocolo:
                    identificador: PROTOCOLO-ACADEMICO-FICTICIO
                    versao: v0.1
                nota: Este comprovante é de demonstração. Não é documento clínico, não é protocolo oficial e não coloca você em
                  fila real.
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: >
            CONFLITO_ESTADO, nada registrado: análise vigente com pendência ou não verificável; sem análise vigente da
            versão atual; análise em andamento; pedido já só para consulta. As recusas de completude dizem que a
            restrição é do simulador acadêmico e não impede atendimento.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    get:
      tags: [Submissão simulada]
      summary: Consulta o comprovante da submissão simulada do pedido próprio (RC-17)
      description: Mesmo comprovante da conclusão. Pedido não submetido, inexistente ou alheio → o mesmo 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Comprovante
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComprovanteSimulado" }
              example:
                solicitacaoId: '1'
                referencia: SIM-2026-000001
                submetidaEm: '2026-11-12T20:00:00Z'
                simulada: true
                destaque: SIMULAÇÃO ACADÊMICA — NÃO ENVIADO AO SUS
                servico:
                  localidade: Município Exemplo
                  especialidade: Consulta ambulatorial em cardiologia
                  avisoFicticio: Documento acadêmico fictício. Não é exigência oficial de nenhum serviço de saúde ou do SUS.
                versaoAnalisada:
                  analiseId: '2'
                  revisao: 3
                  protocolo:
                    identificador: PROTOCOLO-ACADEMICO-FICTICIO
                    versao: v0.1
                nota: Este comprovante é de demonstração. Não é documento clínico, não é protocolo oficial e não coloca você em
                  fila real.
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}/reenvio:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    post:
      tags: [Reenvio]
      summary: Verifica a versão corrigida do pedido próprio (RC-16; leitura e resumo SIMULADOS)
      description: >
        Sem corpo (ignorado). Para a revisão atual: leitura (reaproveita a existente) -> conferência -> análise (RC-13)
        -> resumo (RC-14). Se a leitura tem campo identificado sem decisão da paciente, para em `etapa: CONFERENCIA`
        sem registrar análise. Repetir sem mudança devolve a análise vigente (200), sem análise nem resumo novo.
        Falhas mantêm status e código da etapa, com `detalhes[0] = { campo: etapa, mensagem: LEITURA | CONFERENCIA |
        ANALISE }`; a última análise concluída fica intacta. Nenhuma pendência é marcada como resolvida sem novo resultado.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Nova análise registrada (etapa CONCLUIDA, ou RESUMO se o resumo não pôde ser gravado agora)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reenvio" }
              example:
                solicitacaoId: '1'
                etapa: CONCLUIDA
                revisao: 3
                extracaoId: '2'
                leituraCriada: false
                camposSemDecisao: 0
                analiseCriada: true
                simulada: true
                orientacao: Nova verificação concluída. Compare com o resultado anterior. "Sem pendências identificadas" não é aprovação
                  do SUS.
                analise:
                  id: '2'
                  revisao: 3
                  vigente: true
                  executadaEm: '2026-11-12T20:00:00Z'
                  protocolo:
                    identificador: PROTOCOLO-ACADEMICO-FICTICIO
                    versao: v0.1
                  conferenciaConsiderada: '2026-11-12T20:00:00Z'
                  dataReferencia: '2026-11-12'
                  resultadoGeral: SEM_PENDENCIAS_IDENTIFICADAS
                  rotuloResultado: Sem pendências identificadas
                  simulada: true
                  aviso: 'Análise simulada: leitura simulada dos documentos e protocolo acadêmico fictício. "Sem pendências identificadas"
                    não é aprovação do SUS.'
                  documentos:
                  - documentoId: '1'
                    nomeArquivo: encaminhamento-sintetico.pdf
                    tipoDeclarado: ENCAMINHAMENTO
                    disponivel: true
                  - documentoId: '2'
                    nomeArquivo: identificacao-sintetica.png
                    tipoDeclarado: IDENTIFICACAO
                    disponivel: true
                  resultados:
                  - codigoRegra: RC-R01
                    descricao: Encaminhamento presente
                    resultado: ATENDE
                  - codigoRegra: RC-R02
                    descricao: Identificação coerente entre documentos
                    resultado: ATENDE
                  - codigoRegra: RC-R03
                    descricao: Documento de identificação
                    resultado: ATENDE
                  - codigoRegra: RC-R04
                    descricao: Motivo do encaminhamento informado
                    resultado: ATENDE
                  - codigoRegra: RC-R05
                    descricao: Encaminhamento dentro da validade
                    resultado: ATENDE
                  - codigoRegra: RC-R06
                    descricao: Autorização do responsável legal
                    resultado: NAO_APLICAVEL
                  pendencias: []
                  resumo:
                    texto: Nenhuma pendência foi identificada nesta revisão. Isso não significa aprovação do SUS. Os critérios são
                      demonstrativos.
                    origem: ADAPTADOR_MOCKADO
                    simulado: true
                    itens: []
                  comparacao:
                    analiseAnteriorId: '1'
                    revisaoAnterior: 2
                    executadaEmAnterior: '2026-11-12T20:00:00Z'
                    itens:
                    - codigoRegra: RC-R02
                      descricaoRegra: Identificação coerente entre documentos
                      situacao: RESOLVIDA
                      resultadoAnterior: NAO_VERIFICAVEL
                      resultadoAtual: ATENDE
                    - codigoRegra: RC-R03
                      descricaoRegra: Documento de identificação
                      situacao: RESOLVIDA
                      resultadoAnterior: PENDENTE
                      resultadoAtual: ATENDE
                    - codigoRegra: RC-R06
                      descricaoRegra: Autorização do responsável legal
                      situacao: RESOLVIDA
                      resultadoAnterior: NAO_VERIFICAVEL
                      resultadoAtual: NAO_APLICAVEL
        "200":
          description: Parou na conferência (etapa CONFERENCIA) ou devolveu a análise vigente que já valia
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reenvio" }
              example:
                solicitacaoId: '1'
                etapa: CONFERENCIA
                revisao: 3
                extracaoId: '2'
                leituraCriada: true
                camposSemDecisao: 8
                analiseCriada: false
                simulada: true
                orientacao: Confira a leitura dos documentos da revisão 3 antes do novo resultado. Nenhuma pendência foi marcada
                  como resolvida.
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: >
            CONFLITO_ESTADO (pedido submetido, sem detalhes; documentos mudaram durante a leitura, etapa LEITURA;
            documentos ou conferência mudaram ou o limite passou durante a análise, etapa ANALISE) ou
            ANALISE_EM_ANDAMENTO (etapa ANALISE; cabeçalho Retry-After)
          headers:
            Retry-After:
              description: Só em ANALISE_EM_ANDAMENTO; segundos até o limite da análise em andamento
              schema: { type: integer, minimum: 1 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: SEM_DOCUMENTOS (etapa LEITURA); envie o documento corrigido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503":
          description: >
            LEITURA_INDISPONIVEL (etapa LEITURA; repetir sem reenviar arquivo), ANALISE_INDISPONIVEL (etapa ANALISE;
            pedido em FALHA_ANALISE) ou DEPENDENCIA_INDISPONIVEL (etapa da falha)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /admin/indicadores:
    get:
      tags: [Administração]
      summary: Protocolo ativo e indicadores agregados do administrador (RC-20)
      description: >
        Somente ADMINISTRADOR; paciente recebe 403 antes de qualquer consulta. Só agregados e dados do protocolo:
        nenhum nome, e-mail, identificador de paciente ou pedido, arquivo, trecho lido, resumo ou mensagem de pendência.
        Análises e pendências contam só as análises vigentes; pedidos em FALHA_ANALISE são contados à parte (a análise
        que falha não é gravada). Dados sintéticos de demonstração. Decisões: specs/024-app-admin-indicadores.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Indicadores do momento; zeros e listas vazias quando não há dados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Indicadores"
              example:
                dadosSinteticos: true
                aviso: Indicadores agregados de demonstracao, calculados sobre dados sinteticos. Nao representam pacientes, filas
                  ou servicos reais.
                consultadoEm: '2026-11-12T20:00:00Z'
                protocolosAtivos:
                - protocoloId: PROTOCOLO-ACADEMICO-FICTICIO-v0.1
                  identificador: PROTOCOLO-ACADEMICO-FICTICIO
                  versao: v0.1
                  quantidadeRegras: 6
                  regras:
                  - codigo: RC-R01
                    descricao: Encaminhamento presente
                  - codigo: RC-R02
                    descricao: Identificação coerente entre documentos
                  - codigo: RC-R03
                    descricao: Documento de identificação
                  - codigo: RC-R04
                    descricao: Motivo do encaminhamento informado
                  - codigo: RC-R05
                    descricao: Encaminhamento dentro da validade
                  - codigo: RC-R06
                    descricao: Autorização do responsável legal
                totalPedidos: 0
                analisesPorResultado:
                  semPendenciasIdentificadas: 0
                  comPendencias: 0
                  requerConferencia: 0
                pedidosEmFalhaAnalise: 0
                regrasComMaisPendencias: []
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "405":
          description: METODO_NAO_PERMITIDO (só GET)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example:
                codigo: METODO_NAO_PERMITIDO
                mensagem: Metodo HTTP nao permitido para este recurso.
        "503": { $ref: "#/components/responses/Indisponivel" }
  /docs:
    get:
      tags: [Documentação]
      summary: Esta documentação interativa (Swagger UI), servida pela própria API (RC-28)
      description: >
        Pública, sem sessão, somente GET; também em /docs/ e /docs/index.html. Página e arquivos vêm da própria API
        (Swagger UI de versão fixa, sem CDN). Política de conteúdo própria só nas respostas 200 desta rota; outros
        caminhos sob /docs respondem 404 NAO_ENCONTRADO e outros métodos, 405 METODO_NAO_PERMITIDO.
      security: []
      responses:
        "200":
          description: Página HTML do Swagger UI
          content:
            text/html:
              schema: { type: string }
        "404":
          description: Caminho fora da lista fixa de arquivos (NAO_ENCONTRADO)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "405":
          description: Método diferente de GET (METODO_NAO_PERMITIDO; cabeçalho Allow GET)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
  /docs/openapi.yaml:
    get:
      tags: [Documentação]
      summary: Este contrato OpenAPI em YAML, idêntico a docs/api/openapi.yaml (RC-28)
      security: []
      responses:
        "200":
          description: Contrato OpenAPI 3.0.3
          content:
            application/yaml:
              schema: { type: string }
        "405":
          description: Método diferente de GET (METODO_NAO_PERMITIDO)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token recebido em POST /auth/login, enviado em Authorization (Bearer).
    chaveSimulador:
      type: apiKey
      in: header
      name: X-Chave-Simulador
      description: >
        Chave do simulador de sensores (variável IOT_API_KEY), válida somente na rota de telemetria
        POST /sessoes-captura/{id}/leituras (RC-21). Em qualquer outra rota responde 403; o valor real nunca e versionado.
  responses:
    NaoAutenticado:
      description: Sessão ausente, expirada ou encerrada (NAO_AUTENTICADO)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example:
            codigo: NAO_AUTENTICADO
            mensagem: Sessão ausente ou expirada. Entre novamente.
    AcessoNegado:
      description: Perfil sem permissão, por exemplo administrador ou chave do simulador (ACESSO_NEGADO)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example:
            codigo: ACESSO_NEGADO
            mensagem: Voce nao tem permissao para esta operacao.
    NaoEncontrado:
      description: Pedido inexistente, de outra paciente ou id inválido (NAO_ENCONTRADO, resposta idêntica)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example:
            codigo: NAO_ENCONTRADO
            mensagem: Recurso nao encontrado.
    Indisponivel:
      description: Falha de dependência - banco indisponível ou não configurado (DEPENDENCIA_INDISPONIVEL)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erro" }
          example:
            codigo: DEPENDENCIA_INDISPONIVEL
            mensagem: Servico temporariamente indisponivel. Tente novamente em instantes.
  schemas:
    AnaliseGravada:
      type: object
      description: >
        Análise gravada (RC-13). Sempre simulada (leitura simulada, protocolo acadêmico fictício). Sem valores lidos
        dos documentos; resumo opcional da RC-14. Campos nulos ficam fora do JSON.
      required: [id, revisao, vigente, executadaEm, protocolo, resultadoGeral, rotuloResultado, simulada, aviso, documentos, resultados, pendencias]
      properties:
        id: { type: string, example: "31" }
        revisao: { type: integer, minimum: 1, description: Versão do conjunto documental avaliada }
        vigente: { type: boolean }
        executadaEm: { type: string, format: date-time }
        protocolo:
          type: object
          required: [identificador, versao]
          properties:
            identificador: { type: string, example: PROTOCOLO-ACADEMICO-FICTICIO }
            versao: { type: string, example: v0.1 }
        conferenciaConsiderada: { type: string, format: date-time, description: Omitido só nas análises da carga sintética }
        dataReferencia: { type: string, format: date, description: Omitida só nas análises da carga sintética }
        resultadoGeral: { type: string, enum: [COM_PENDENCIAS, REQUER_CONFERENCIA, SEM_PENDENCIAS_IDENTIFICADAS] }
        rotuloResultado: { type: string, enum: [Com pendências, Confira a leitura, Sem pendências identificadas], description: Texto da RC-15 correspondente ao resultado geral }
        simulada: { type: boolean, enum: [true] }
        aviso: { type: string }
        documentos:
          type: array
          items:
            type: object
            required: [documentoId, nomeArquivo, tipoDeclarado, disponivel]
            properties:
              documentoId: { type: string }
              nomeArquivo: { type: string }
              tipoDeclarado: { $ref: "#/components/schemas/TipoDocumental" }
              disponivel: { type: boolean, description: false se depois foi substituído ou removido }
        resultados:
          type: array
          items:
            type: object
            required: [codigoRegra, descricao, resultado]
            properties:
              codigoRegra: { type: string, example: RC-R01 }
              descricao: { type: string }
              resultado: { type: string, enum: [ATENDE, PENDENTE, NAO_VERIFICAVEL, NAO_APLICAVEL] }
              motivo: { $ref: "#/components/schemas/MotivoNaoVerificavel" }
        pendencias:
          type: array
          items: { $ref: "#/components/schemas/PendenciaGravada" }
        resumo:
          $ref: "#/components/schemas/ResumoSimulado"
        comparacao:
          $ref: "#/components/schemas/ComparacaoAnalises"
    ComparacaoAnalises:
      type: object
      description: >
        RC-16. Comparação calculada (não gravada) com a análise registrada imediatamente antes no mesmo pedido.
        Omitida na primeira análise e entre versões de protocolo diferentes. RESOLVIDA só existe entre análises
        concluídas; não é aprovação do SUS.
      required: [analiseAnteriorId, revisaoAnterior, executadaEmAnterior, itens]
      properties:
        analiseAnteriorId: { type: string, example: "12" }
        revisaoAnterior: { type: integer, minimum: 1 }
        executadaEmAnterior: { type: string, format: date-time }
        itens:
          type: array
          description: Só regras com pendência em pelo menos uma das duas análises, na ordem da atual
          items:
            type: object
            required: [codigoRegra, descricaoRegra, situacao, resultadoAnterior, resultadoAtual]
            properties:
              codigoRegra: { type: string, example: RC-R04 }
              descricaoRegra: { type: string }
              situacao: { type: string, enum: [RESOLVIDA, CONTINUA, NOVA] }
              resultadoAnterior: { type: string, enum: [ATENDE, PENDENTE, NAO_VERIFICAVEL, NAO_APLICAVEL] }
              resultadoAtual: { type: string, enum: [ATENDE, PENDENTE, NAO_VERIFICAVEL, NAO_APLICAVEL] }
    ComprovanteSimulado:
      type: object
      description: >
        RC-17 (SubmissaoResponse). Comprovante de demonstração: não é documento clínico, não é protocolo oficial, não
        indica fila, vaga, prazo nem aprovação. destaque e nota são textos fixos do servidor.
      required: [solicitacaoId, referencia, submetidaEm, simulada, destaque, servico, versaoAnalisada, nota]
      properties:
        solicitacaoId: { type: string }
        referencia: { type: string, pattern: "^SIM-[0-9]{4}-[0-9]{6,}$", example: SIM-2026-000012 }
        submetidaEm: { type: string, format: date-time }
        simulada: { type: boolean, enum: [true] }
        destaque: { type: string, enum: ["SIMULAÇÃO ACADÊMICA — NÃO ENVIADO AO SUS"] }
        servico:
          type: object
          required: [localidade, especialidade, avisoFicticio]
          properties:
            localidade: { type: string }
            especialidade: { type: string }
            avisoFicticio: { type: string }
        versaoAnalisada:
          type: object
          required: [analiseId, revisao, protocolo]
          properties:
            analiseId: { type: string }
            revisao: { type: integer, minimum: 1 }
            protocolo:
              type: object
              required: [identificador, versao]
              properties:
                identificador: { type: string, example: PROTOCOLO-ACADEMICO-FICTICIO }
                versao: { type: string, example: v0.1 }
        nota: { type: string }
    Reenvio:
      type: object
      description: RC-16. Até onde a verificação da versão corrigida chegou; sempre simulada. Campos nulos ficam fora do JSON.
      required: [solicitacaoId, etapa, revisao, extracaoId, leituraCriada, camposSemDecisao, analiseCriada, simulada, orientacao]
      properties:
        solicitacaoId: { type: string }
        etapa: { type: string, enum: [CONFERENCIA, RESUMO, CONCLUIDA] }
        revisao: { type: integer, minimum: 1, description: Revisão dos documentos lida }
        extracaoId: { type: string, description: Leitura da revisão atual (para a conferência da RC-11) }
        leituraCriada: { type: boolean }
        camposSemDecisao: { type: integer, minimum: 0 }
        analiseCriada: { type: boolean }
        simulada: { type: boolean, enum: [true] }
        orientacao: { type: string }
        analise:
          $ref: "#/components/schemas/AnaliseGravada"
    ResumoSimulado:
      type: object
      required: [texto, origem, simulado, itens]
      properties:
        texto: { type: string, maxLength: 2000 }
        origem: { type: string, enum: [ADAPTADOR_MOCKADO, PADRAO] }
        simulado: { type: boolean, enum: [true] }
        itens:
          type: array
          items:
            type: object
            required: [codigoRegra, acao, responsavel]
            properties:
              codigoRegra: { type: string }
              acao: { type: string }
              responsavel: { type: string, enum: [PACIENTE, UNIDADE_EMISSORA] }
    MotivoNaoVerificavel:
      type: string
      enum: [CAMPO_ILEGIVEL, DOCUMENTO_NAO_LIDO, TRANSCRICAO_NAO_CONFERIDA, DIVERGENCIA_APONTADA, VALOR_NAO_INTERPRETAVEL, CONDICAO_INDETERMINADA, DOCUMENTOS_INSUFICIENTES, DEPENDE_DE_DOCUMENTO_AUSENTE]
    PendenciaGravada:
      type: object
      required: [codigoRegra, descricaoRegra, tipo, explicacao, responsavel, orientacao, evidencias]
      properties:
        codigoRegra: { type: string }
        descricaoRegra: { type: string }
        tipo: { type: string, enum: [PENDENTE, NAO_VERIFICAVEL] }
        explicacao: { type: string }
        motivo: { $ref: "#/components/schemas/MotivoNaoVerificavel" }
        responsavel: { type: string, enum: [PACIENTE, UNIDADE_EMISSORA] }
        orientacao: { type: string, description: Providencia textual da RC-15; nao altera o responsavel nem garante acao de reenvio disponivel }
        evidencias:
          type: array
          items:
            type: object
            required: [documentoId, campo, situacao]
            properties:
              documentoId: { type: string }
              campo: { type: string, enum: [TIPO_DOCUMENTO, NOME, DATA_NASCIMENTO, MOTIVO_ENCAMINHAMENTO, DATA_EMISSAO, AUTORIZACAO_ASSINADA] }
              situacao: { type: string, enum: [CONFIRMADO, NAO_LOCALIZADO, ILEGIVEL, NAO_CONFERIDO, DIVERGENCIA_APONTADA, DOCUMENTO_NAO_LIDO] }
              origem: { $ref: "#/components/schemas/Origem" }
    HistoricoAnalises:
      type: object
      required: [solicitacaoId, estado, versaoConjuntoDocumental, limite, analises]
      properties:
        solicitacaoId: { type: string }
        estado: { type: string }
        versaoConjuntoDocumental: { type: integer, minimum: 1 }
        execucao:
          type: object
          description: Só em PROCESSANDO
          required: [situacao, iniciadaEm, limiteEm]
          properties:
            situacao: { type: string, enum: [EM_ANDAMENTO, INTERROMPIDA] }
            iniciadaEm: { type: string, format: date-time }
            limiteEm: { type: string, format: date-time }
        vigenteId: { type: string, description: Omitido quando nenhuma análise vale para a versão atual }
        limite: { type: integer, example: 50 }
        analises:
          type: array
          items: { $ref: "#/components/schemas/AnaliseGravada" }
    RemocaoDocumento:
      type: object
      description: Estado do conjunto documental depois de remover um documento (RC-09). Não devolve o documento removido.
      required: [versaoConjuntoDocumental, documentosDisponiveis]
      properties:
        versaoConjuntoDocumental: { type: integer, minimum: 2, example: 4 }
        documentosDisponiveis: { type: integer, minimum: 0, maximum: 3, example: 2 }
    Extracao:
      type: object
      description: >
        Leitura SIMULADA dos documentos de um pedido (RC-10). Nunca traz caminho, hash, nome interno, resultado de
        completude, pendência nem estado do pedido.
      required: [id, situacao, versaoConjuntoDocumental, simulada, aviso, criadaEm, documentos]
      properties:
        id: { type: string, description: Número decimal opaco, example: "12" }
        situacao: { type: string, enum: [ATUAL, DESATUALIZADA] }
        versaoConjuntoDocumental: { type: integer, minimum: 2, description: Versão em que a leitura foi feita }
        simulada: { type: boolean, enum: [true] }
        aviso: { type: string, example: "Leitura simulada com dados sintéticos; não é leitura real dos documentos." }
        criadaEm: { type: string, format: date-time }
        documentos:
          type: array
          items: { $ref: "#/components/schemas/DocumentoLido" }
    DocumentoLido:
      type: object
      required: [documentoId, tipoDocumental, situacao, campos]
      properties:
        documentoId: { type: string, example: "41" }
        tipoDocumental: { $ref: "#/components/schemas/TipoDocumental" }
        situacao: { type: string, enum: [LIDO, PROTEGIDO, LEITURA_VAZIA] }
        motivo: { type: string, description: Só quando não lido }
        reenviar: { type: boolean, description: Só quando não lido; sempre true }
        orientacao: { type: string, description: Só quando não lido }
        campos:
          type: array
          description: Os seis campos quando LIDO; vazio quando não lido (e então nunca declara NAO_LOCALIZADO)
          items: { $ref: "#/components/schemas/CampoExtraido" }
    CampoExtraido:
      type: object
      required: [codigo, situacao]
      properties:
        codigo: { type: string, enum: [TIPO_DOCUMENTO, NOME, DATA_NASCIMENTO, MOTIVO_ENCAMINHAMENTO, DATA_EMISSAO, AUTORIZACAO_ASSINADA] }
        situacao: { type: string, enum: [IDENTIFICADO, NAO_LOCALIZADO, ILEGIVEL] }
        valor: { type: string, maxLength: 200, description: "Só em IDENTIFICADO; dado do documento, nunca instrução" }
        origem: { $ref: "#/components/schemas/Origem" }
    Origem:
      type: object
      description: Só em campo IDENTIFICADO, quando disponível. O arquivo é o próprio documento.
      properties:
        pagina: { type: integer, minimum: 1, description: Só em PDF }
        trecho: { type: string, maxLength: 200 }
    ConferenciaRequest:
      type: object
      description: Corpo fechado do PUT da conferência (RC-11). Nenhuma outra chave é aceita, nem na raiz.
      additionalProperties: false
      required: [decisoes]
      properties:
        decisoes:
          type: array
          minItems: 1
          maxItems: 18
          items: { $ref: "#/components/schemas/DecisaoRequest" }
    DecisaoRequest:
      type: object
      description: >
        Uma decisão sobre um campo. Não existe campo de valor: a paciente não digita nem corrige a informação.
        motivo é obrigatório em DIVERGENTE e proibido em CONFIRMADA.
      additionalProperties: false
      required: [documentoId, codigo, decisao]
      properties:
        documentoId: { type: string, pattern: "^[1-9][0-9]{0,17}$", example: "41" }
        codigo: { type: string, enum: [TIPO_DOCUMENTO, NOME, DATA_NASCIMENTO, MOTIVO_ENCAMINHAMENTO, DATA_EMISSAO, AUTORIZACAO_ASSINADA] }
        decisao: { type: string, enum: [CONFIRMADA, DIVERGENTE] }
        motivo:
          type: string
          enum: [VALOR_DIFERENTE_DO_DOCUMENTO, CAMPO_EXISTE_E_NAO_FOI_LIDO]
          description: VALOR_DIFERENTE_DO_DOCUMENTO em campo identificado; CAMPO_EXISTE_E_NAO_FOI_LIDO em campo não localizado
    Conferencia:
      type: object
      description: >
        Conferência da transcrição de uma leitura SIMULADA (RC-11). Nunca traz caminho, hash, nome interno, resultado
        de regra, pendência nem estado do pedido. liberadoParaSubmissao é sempre false.
      required: [extracaoId, situacao, liberadoParaSubmissao, simulada, aviso, atualizadaEm, resumo, documentos]
      properties:
        extracaoId: { type: string, example: "12" }
        situacao:
          type: string
          enum: [PENDENTE, REQUER_CONFERENCIA, CONFERIDA, DESATUALIZADA]
          description: Calculada, nunca gravada. DESATUALIZADA > REQUER_CONFERENCIA > PENDENTE > CONFERIDA.
        liberadoParaSubmissao: { type: boolean, enum: [false] }
        simulada: { type: boolean, enum: [true] }
        aviso: { type: string, example: "Leitura simulada com dados sintéticos; não é leitura real dos documentos." }
        atualizadaEm: { type: string, format: date-time, description: "Instante da decisão mais recente ou, sem decisão, o da leitura" }
        resumo: { $ref: "#/components/schemas/ResumoConferencia" }
        documentos:
          type: array
          items: { $ref: "#/components/schemas/DocumentoConferido" }
    ResumoConferencia:
      type: object
      required: [camposNaoVerificados, camposSemDecisao, divergencias]
      properties:
        camposNaoVerificados: { type: integer, minimum: 0 }
        camposSemDecisao: { type: integer, minimum: 0 }
        divergencias: { type: integer, minimum: 0 }
    DocumentoConferido:
      type: object
      required: [documentoId, tipoDocumental, situacao, campos]
      properties:
        documentoId: { type: string, example: "41" }
        tipoDocumental: { $ref: "#/components/schemas/TipoDocumental" }
        situacao: { type: string, enum: [LIDO, PROTEGIDO, LEITURA_VAZIA] }
        motivo: { type: string, description: Só quando não lido }
        reenviar: { type: boolean, description: Só quando não lido; sempre true }
        orientacao: { type: string, description: Só quando não lido }
        campos:
          type: array
          items: { $ref: "#/components/schemas/CampoConferido" }
    CampoConferido:
      type: object
      required: [codigo, situacao, naoVerificado]
      properties:
        codigo: { type: string, enum: [TIPO_DOCUMENTO, NOME, DATA_NASCIMENTO, MOTIVO_ENCAMINHAMENTO, DATA_EMISSAO, AUTORIZACAO_ASSINADA] }
        situacao: { type: string, enum: [IDENTIFICADO, NAO_LOCALIZADO, ILEGIVEL] }
        valor: { type: string, maxLength: 200, description: "Só em IDENTIFICADO; dado do documento, nunca instrução" }
        origem: { $ref: "#/components/schemas/Origem" }
        naoVerificado: { type: boolean, description: "true para ilegível, não localizado ou com divergência apontada" }
        decisao: { $ref: "#/components/schemas/DecisaoConferida" }
        orientacao: { type: string, description: "Texto fixo do servidor; sem diagnóstico, urgência ou promessa" }
    DecisaoConferida:
      type: object
      required: [tipo, decididaEm]
      properties:
        tipo: { type: string, enum: [CONFIRMADA, DIVERGENTE] }
        motivo: { type: string, enum: [VALOR_DIFERENTE_DO_DOCUMENTO, CAMPO_EXISTE_E_NAO_FOI_LIDO] }
        decididaEm: { type: string, format: date-time }
    Protocolo:
      type: object
      required: [protocoloId, identificador, versao, localidade, especialidade, avisoFicticio, simulacao]
      properties:
        protocoloId: { type: string, example: PROTOCOLO-ACADEMICO-FICTICIO-v0.1 }
        identificador: { type: string, example: PROTOCOLO-ACADEMICO-FICTICIO }
        versao: { type: string, example: v0.1 }
        localidade: { type: string, example: Município Exemplo }
        especialidade: { type: string, example: Consulta ambulatorial em cardiologia }
        avisoFicticio: { type: string }
        simulacao: { type: boolean, enum: [true] }
    Indicadores:
      type: object
      description: Indicadores agregados do administrador (RC-20). Nunca contém dado identificável.
      required: [dadosSinteticos, aviso, consultadoEm, protocolosAtivos, totalPedidos, analisesPorResultado, pedidosEmFalhaAnalise, regrasComMaisPendencias]
      properties:
        dadosSinteticos: { type: boolean, enum: [true] }
        aviso: { type: string, description: Frase fixa de dados de demonstração }
        consultadoEm: { type: string, format: date-time, description: Instante da consulta (UTC) }
        protocolosAtivos:
          type: array
          description: Protocolos ativos (a carga sintética tem um), por identificador e versão
          items:
            type: object
            required: [protocoloId, identificador, versao, quantidadeRegras, regras]
            properties:
              protocoloId: { type: string, example: "PROTOCOLO-ACADEMICO-FICTICIO-v0.1" }
              identificador: { type: string }
              versao: { type: string, example: "v0.1" }
              quantidadeRegras: { type: integer, minimum: 0 }
              regras:
                type: array
                description: Regras na ordem do protocolo
                items:
                  type: object
                  required: [codigo, descricao]
                  properties:
                    codigo: { type: string, example: "RC-R01" }
                    descricao: { type: string, example: "Encaminhamento presente" }
        totalPedidos: { type: integer, minimum: 0, description: "Todos os pedidos, em qualquer estado" }
        analisesPorResultado:
          type: object
          description: Análises vigentes por resultado geral (as três chaves sempre presentes)
          required: [semPendenciasIdentificadas, comPendencias, requerConferencia]
          properties:
            semPendenciasIdentificadas: { type: integer, minimum: 0 }
            comPendencias: { type: integer, minimum: 0 }
            requerConferencia: { type: integer, minimum: 0 }
        pedidosEmFalhaAnalise: { type: integer, minimum: 0, description: Pedidos com estado atual FALHA_ANALISE }
        regrasComMaisPendencias:
          type: array
          maxItems: 5
          description: Pendências das análises vigentes por regra; só total maior que zero; total desc, código asc
          items:
            type: object
            required: [codigo, descricao, total, pendentes, naoVerificaveis]
            properties:
              codigo: { type: string }
              descricao: { type: string }
              total: { type: integer, minimum: 1 }
              pendentes: { type: integer, minimum: 0 }
              naoVerificaveis: { type: integer, minimum: 0 }
    ListaProtocolos:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: "#/components/schemas/Protocolo" }
    SolicitacaoRequest:
      type: object
      required: [protocoloId]
      properties:
        protocoloId:
          type: string
          maxLength: 100
          description: Serviço escolhido, valor de `protocoloId` devolvido por GET /protocolos. Deve ser texto JSON.
          example: PROTOCOLO-ACADEMICO-FICTICIO-v0.1
    TipoDocumental:
      type: string
      enum: [ENCAMINHAMENTO, IDENTIFICACAO, AUTORIZACAO_RESPONSAVEL, OUTRO]
      description: O que o arquivo diz ser (informado pela paciente); não prova que o conteúdo corresponde.
    Documento:
      type: object
      required: [id, solicitacaoId, nomeArquivo, tipoDocumental, formato, tamanhoBytes, paginas, estadoEnvio, revisaoEntrada, enviadoEm, simulacao]
      properties:
        id: { type: string, description: Número decimal opaco, example: "41" }
        solicitacaoId: { type: string, example: "12" }
        nomeArquivo: { type: string, description: Nome de exibição saneado (nunca o nome de armazenamento), example: encaminhamento-sintetico.pdf }
        tipoDocumental: { $ref: "#/components/schemas/TipoDocumental" }
        formato: { type: string, enum: [PDF, JPEG, PNG], description: Decidido pelo conteúdo }
        tamanhoBytes: { type: integer, minimum: 1, maximum: 5242880 }
        paginas: { type: integer, minimum: 1, maximum: 5, description: Páginas do PDF; 1 para imagens }
        estadoEnvio:
          type: string
          enum: [ENVIADO]
          description: Estado do envio, não da análise. Novos valores só entram em histórias de processamento.
        revisaoEntrada: { type: integer, minimum: 2 }
        enviadoEm: { type: string, format: date-time }
        simulacao: { type: boolean, enum: [true] }
    DocumentoEnviado:
      allOf:
        - $ref: "#/components/schemas/Documento"
        - type: object
          required: [versaoConjuntoDocumental, documentosDisponiveis]
          properties:
            versaoConjuntoDocumental: { type: integer, minimum: 2, description: Revisão do pedido após o envio }
            documentosDisponiveis: { type: integer, minimum: 1, maximum: 3 }
    ListaDocumentos:
      type: object
      required: [documentos, total, maximo, versaoConjuntoDocumental]
      properties:
        documentos:
          type: array
          maxItems: 3
          items: { $ref: "#/components/schemas/Documento" }
        total: { type: integer }
        maximo: { type: integer, example: 3 }
        versaoConjuntoDocumental: { type: integer, minimum: 1 }
    Analise:
      type: object
      required: [situacao, mensagem]
      description: Situação da análise para a versão atual dos documentos (calculada desde a RC-13). Upload concluído não é análise concluída.
      properties:
        situacao: { type: string, enum: [NAO_REALIZADA, EM_ANDAMENTO, CONCLUIDA] }
        mensagem: { type: string }
        resultadoGeral: { type: string, enum: [COM_PENDENCIAS, REQUER_CONFERENCIA, SEM_PENDENCIAS_IDENTIFICADAS], description: Só em CONCLUIDA }
    Solicitacao:
      type: object
      required: [id, protocoloId, servico, estado, revisao, criadaEm, atualizadaEm, simulacao, versaoConjuntoDocumental, documentosDisponiveis, analise]
      properties:
        id: { type: string, description: Número decimal opaco, example: "12" }
        protocoloId: { type: string }
        servico:
          type: object
          required: [localidade, especialidade, avisoFicticio]
          properties:
            localidade: { type: string }
            especialidade: { type: string }
            avisoFicticio: { type: string }
        estado:
          type: string
          enum: [RASCUNHO, PROCESSANDO, REQUER_CONFERENCIA, COM_PENDENCIAS, SEM_PENDENCIAS_IDENTIFICADAS, FALHA_ANALISE, SUBMETIDA_SIMULACAO]
          description: RASCUNHO desde a RC-07; PROCESSANDO, COM_PENDENCIAS, REQUER_CONFERENCIA, SEM_PENDENCIAS_IDENTIFICADAS e FALHA_ANALISE desde a RC-13.
        revisao: { type: integer, minimum: 1 }
        criadaEm: { type: string, format: date-time }
        atualizadaEm: { type: string, format: date-time }
        simulacao: { type: boolean, enum: [true] }
        versaoConjuntoDocumental: { type: integer, minimum: 1, description: Igual a `revisao` (RC-08) }
        documentosDisponiveis: { type: integer, minimum: 0, maximum: 3, description: Documentos disponíveis do pedido (RC-08) }
        analise: { $ref: "#/components/schemas/Analise" }
    ListaSolicitacoes:
      type: object
      required: [itens, limite]
      properties:
        itens:
          type: array
          items: { $ref: "#/components/schemas/Solicitacao" }
        limite: { type: integer, example: 50 }
    Saude:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP]
    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          maxLength: 254
          example: paciente.a@exemplo.invalid
        senha:
          type: string
          description: Até 72 bytes em UTF-8; nunca é registrada em log.
          writeOnly: true
    UsuarioResumo:
      type: object
      required: [nome, perfil]
      properties:
        nome: { type: string, example: Paciente A (fictícia) }
        perfil:
          type: string
          enum: [PACIENTE, ADMINISTRADOR]
    LoginResponse:
      type: object
      required: [token, tipo, expiraEm, usuario]
      properties:
        token:
          type: string
          description: 43 caracteres (base64url); só aparece nesta resposta.
        tipo:
          type: string
          enum: [Bearer]
        expiraEm:
          type: string
          format: date-time
          example: "2026-11-12T22:30:00Z"
        usuario:
          $ref: "#/components/schemas/UsuarioResumo"
    SessaoResponse:
      type: object
      required: [usuario, expiraEm]
      properties:
        usuario:
          $ref: "#/components/schemas/UsuarioResumo"
        expiraEm:
          type: string
          format: date-time
    Erro:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo: { type: string, example: NAO_ENCONTRADO }
        mensagem: { type: string, example: Recurso nao encontrado. }
        idRastreamento: { type: string }
        detalhes:
          type: array
          items:
            type: object
            required: [campo, mensagem]
            properties:
              campo: { type: string }
              mensagem: { type: string }
    TextoSimulado:
      type: object
      description: >
        Texto do resumo simulado (a IA é mockada). Deve ser exibido como texto puro, nunca como HTML;
        o servidor já escapa os caracteres de marcação no JSON.
      required: [texto, simulado, formato]
      properties:
        texto: { type: string }
        simulado: { type: boolean, enum: [true] }
        formato: { type: string, enum: [texto_puro] }
    SessaoCaptura:
      type: object
      description: Sessão de captura da estação simulada (RC-21).
      required: [id, solicitacaoId, iniciadaEm, aberta, criada, simulada]
      properties:
        id: { type: string, example: "42" }
        solicitacaoId: { type: string, example: "7" }
        iniciadaEm: { type: string, format: date-time }
        aberta: { type: boolean }
        criada: { type: boolean, description: true se esta chamada criou a sessão }
        simulada: { type: boolean, enum: [true] }
    LeituraSensorEnvio:
      type: object
      description: Leitura enviada pelo simulador (RC-21). Só estes campos são aceitos.
      required: [sessaoId, tipo, valor, unidade, medidaEm]
      properties:
        sessaoId: { type: integer, description: Igual ao id do caminho, example: 42 }
        tipo: { type: string, enum: [LUMINOSIDADE, DISTANCIA] }
        valor: { type: number, description: "Luminosidade de 0 a 200000 lux; distância maior que 0 e até 500 cm; 3 casas", example: 350 }
        unidade: { type: string, enum: [LUX, CM], description: LUX com LUMINOSIDADE e CM com DISTANCIA }
        medidaEm: { type: string, format: date-time, description: Com fuso; no máximo 30 s no futuro }
    LeituraSensorGravada:
      type: object
      required: [id, sessaoId, tipo, valor, unidade, medidaEm, recebidaEm]
      properties:
        id: { type: string, example: "901" }
        sessaoId: { type: string, example: "42" }
        tipo: { type: string, enum: [LUMINOSIDADE, DISTANCIA] }
        valor: { type: number }
        unidade: { type: string, enum: [LUX, CM] }
        medidaEm: { type: string, format: date-time }
        recebidaEm: { type: string, format: date-time, description: Relógio do servidor (UTC) }
    Telemetria:
      type: object
      description: >
        Telemetria do pedido (RC-22). Sensores simulados, limites demonstrativos e sem calibração; não comprova a
        legibilidade do arquivo. Campos nulos ficam fora do JSON (sessao sem sessão; ultimaLeitura sem leitura).
      required: [solicitacaoId, consultadaEm, prazoAtualidadeSegundos, simulada, aviso, sensores]
      properties:
        solicitacaoId: { type: string }
        sessao:
          type: object
          required: [id, iniciadaEm, aberta]
          properties:
            id: { type: string }
            iniciadaEm: { type: string, format: date-time }
            aberta: { type: boolean }
        consultadaEm: { type: string, format: date-time }
        prazoAtualidadeSegundos: { type: integer, example: 60 }
        simulada: { type: boolean, enum: [true] }
        aviso: { type: string }
        sensores:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            required: [tipo, unidade, faixa, situacao, orientacao]
            properties:
              tipo: { type: string, enum: [LUMINOSIDADE, DISTANCIA] }
              unidade: { type: string, enum: [LUX, CM] }
              faixa:
                type: object
                properties:
                  minimo: { type: number }
                  maximo: { type: number }
              ultimaLeitura:
                type: object
                properties:
                  valor: { type: number }
                  medidaEm: { type: string, format: date-time }
              situacao: { type: string, enum: [DENTRO_DA_FAIXA, ABAIXO_DA_FAIXA, ACIMA_DA_FAIXA, DESATUALIZADA, SEM_LEITURA] }
              orientacao:
                type: object
                required: [codigo, mensagem]
                properties:
                  codigo:
                    type: string
                    enum: [CONDICAO_ADEQUADA, MELHORAR_ILUMINACAO, REDUZIR_ILUMINACAO_OU_REFLEXO, AFASTAR_DOCUMENTO, APROXIMAR_DOCUMENTO, VERIFICAR_ESTACAO, CAPTURA_SEGUE_SEM_SENSOR]
                  mensagem: { type: string }
