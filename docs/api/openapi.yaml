          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "415":
          description: TIPO_NAO_SUPORTADO (o corpo não é application/json)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: DECISAO_NAO_APLICAVEL (a decisão não cabe à situação do campo; por exemplo, qualquer decisão em campo ilegível ou confirmar campo não localizado); nada é gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}/analises:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    post:
      tags: [Análises]
      summary: Pede a análise do pedido próprio e grava o resultado (RC-13; leitura SIMULADA)
      description: >
        Síncrono, sem corpo. Avalia as regras da versão do protocolo do pedido sobre a leitura atual e a conferência
        atual (RC-12) e grava a análise inteira (resultados, pendências com motivo e evidências), que vira a vigente;
        o pedido vai ao resultado geral. Enquanto roda, o pedido fica em PROCESSANDO (limite de 1 minuto). Só grava se
        a revisão e o instante da conferência ainda forem os avaliados. Repetir sem mudança devolve a vigente (200).
        O resumo da RC-14 e solicitado separadamente. A resposta traz `comparacao` com a análise anterior (RC-16). Ordem: 401, 403, 404, 409 (submetido), 409 ANALISE_EM_ANDAMENTO, 200 (vigente),
        409 (sem leitura atual), avaliação, 409 (entrada mudou ou análise assumida depois do limite) ou 503, 201.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Análise feita e gravada agora; é a vigente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AnaliseGravada" }
              example:
                id: '1'
                revisao: 2
                vigente: true
                executadaEm: '2026-11-12T20:00:00Z'
                protocolo:
                  identificador: PROTOCOLO-ACADEMICO-FICTICIO
                  versao: v0.1
                conferenciaConsiderada: '2026-11-12T20:00:00Z'
                dataReferencia: '2026-11-12'
                resultadoGeral: COM_PENDENCIAS
