openapi: 3.0.3
info:
  title: RegulaCheck API (acadêmica, dados sintéticos)
  version: 1.0.0
  description: |
    API do RegulaCheck, MVP acadêmico. **Dados exclusivamente sintéticos** e protocolo acadêmico fictício. A leitura
    dos documentos, o resumo de pendências e a estação de captura (sensores) são **simulados**, e a submissão é só uma
    **simulação acadêmica**: nada é enviado ao SUS. O sistema não diagnostica, não define urgência e não autoriza
    atendimento.

    Contrato escrito à mão (fonte única: `docs/api/openapi.yaml`), servido por esta API em `GET /docs/openapi.yaml` e
    exibido em `GET /docs` (RC-28). O percurso completo, do login ao comprovante, está em `docs/api/roteiro-avaliacao.md`.

    **Como executar por esta página:** faça `POST /auth/login` com uma conta de demonstração
    (`paciente.a@exemplo.invalid`, `paciente.b@exemplo.invalid` ou `admin@exemplo.invalid`; senha em
    `database/scripts/README.md`), copie o `token` e informe-o em **Authorize** (`bearerAuth`). O token fica só na
    memória desta aba. Use o servidor `/` (mesma origem). Sem banco configurado (`DB_*`), as rotas que dependem dele
    respondem 503 `DEPENDENCIA_INDISPONIVEL`.

    **Códigos de sucesso:** 200 (consulta, repetição idempotente ou situação já existente), 201 (algo novo foi
    gravado, com `Location` quando há recurso endereçável) e 204 (logout e exclusão de rascunho, sem corpo).
    **Nenhuma rota usa 202:** leitura, análise, resumo, reenvio e submissão são síncronos e só respondem depois de
    gravar o resultado.

    **Erros** (corpo padrão `Erro`; catálogo em `docs/api/erros.md`): 400 entrada inválida; 401 sem sessão válida;
    403 perfil sem permissão; 404 recurso inexistente ou de outra paciente (resposta idêntica); 405 método não
    permitido; 409 conflito de estado ou de revisão; 413 arquivo acima de 5 MB; 415 tipo de corpo ou de arquivo não
    suportado; 422 regra de negócio; 503 falha de dependência (banco `DEPENDENCIA_INDISPONIVEL`, leitor simulado
    `LEITURA_INDISPONIVEL`, avaliação `ANALISE_INDISPONIVEL`); 500 `ERRO_INTERNO` genérico, sem detalhe. Ordem nas
    rotas privadas (RC-05): 401 → 403 → 404 → 400/413/415 → 409/422/503. A falha do adaptador simulado de resumo
    **não** é erro: a resposta é 201 com `resumo.origem = PADRAO`, e as pendências ficam preservadas.

    **Proteções (RC-06):** toda resposta traz `X-Content-Type-Options: nosniff`, `Cache-Control: no-store`,
    `Referrer-Policy: no-referrer` e `Content-Security-Policy: default-src 'none'; frame-ancestors 'none'`. A única
    exceção é a das respostas 200 de `/docs`, que precisam executar o Swagger UI. Textos derivados de entrada saem
    como texto puro. Regras de arquivo (tipo real, extensão, 5 MB, 5 páginas, 3 arquivos) em `docs/api/protecoes.md`;
    perfis por rota em `CONTRATO_API.md`.
servers:
  - url: /
    description: Mesma origem desta página (use este ao executar pelo Swagger UI em /docs)
  - url: http://localhost:8080
    description: Computador de desenvolvimento
  - url: http://10.0.2.2:8080
    description: Emulador Android apontando para o computador
tags:
  - name: Saúde
    description: Estado técnico da API (não consulta o banco)
  - name: Autenticação
    description: Login, sessão e logout das contas de demonstração (RC-04)
  - name: Serviços
    description: Protocolos acadêmicos fictícios ativos (RC-07)
  - name: Pedidos
    description: Rascunho da solicitação da paciente (RC-07, RC-09)
  - name: Documentos
    description: Envio, consulta, download, substituição e remoção de arquivos sintéticos (RC-08, RC-09, RC-16)
  - name: Leitura simulada
    description: Leitura SIMULADA dos documentos (RC-10)
  - name: Conferência
    description: A paciente confirma ou aponta divergência na transcrição (RC-11)
  - name: Análises
    description: Critérios do protocolo acadêmico e histórico por revisão (RC-13)
  - name: Resumo simulado
    description: Resumo de pendências por adaptador mockado, identificado como simulado (RC-14)
  - name: Reenvio
    description: Verificação da versão corrigida e comparação com a anterior (RC-16)
  - name: Submissão simulada
    description: Conclusão só no simulador acadêmico; nada é enviado ao SUS (RC-17)
  - name: Estação de captura
    description: Sessão de captura e sensores SIMULADOS de luminosidade e distância (RC-21, RC-22)
  - name: Administração
    description: Indicadores agregados, sem dado identificável (RC-20)
  - name: Documentação
    description: Esta documentação interativa e o contrato OpenAPI (RC-28)
paths:
  /health:
    get:
      tags: [Saúde]
      summary: Estado técnico da API
      responses:
        "200":
          description: API em execução
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Saude"
              example:
                status: UP
        "404":
          description: Rota inexistente em outras URLs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica a conta e abre uma sessão
      description: >
        Senha errada, e-mail inexistente, conta desativada e senha acima de 72 bytes devolvem a
        mesma resposta 401. O token só aparece nesta resposta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: paciente.a@exemplo.invalid
              senha: '<senha de demonstração: database/scripts/README.md>'
      responses:
        "200":
          description: Sessão aberta (prazo padrão de 30 minutos)
          headers:
            Cache-Control:
              schema: { type: string, example: no-store }
              example:
                token: EXEMPLO-token-ficticio-nao-e-valido-0000000
                tipo: Bearer
                expiraEm: '2026-11-12T20:30:00Z'
                usuario:
                  nome: Paciente A (fictícia)
                  perfil: PACIENTE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Corpo ilegível, ou e-mail/senha ausentes ou fora do tamanho (REQUISICAO_INVALIDA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "401":
          description: Credenciais inválidas (CREDENCIAIS_INVALIDAS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              example:
                codigo: CREDENCIAIS_INVALIDAS
                mensagem: E-mail ou senha inválidos.
        "415":
          description: Content-Type diferente de application/json (TIPO_NAO_SUPORTADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "503":
          description: Banco indisponível ou não configurado (DEPENDENCIA_INDISPONIVEL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              example:
                codigo: DEPENDENCIA_INDISPONIVEL
                mensagem: Servico temporariamente indisponivel. Tente novamente em instantes.
  /auth/sessao:
    get:
      tags: [Autenticação]
      summary: Identidade e expiração da sessão atual
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sessão válida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessaoResponse"
        "401":
          description: >
            Token ausente, malformado, desconhecido, expirado ou encerrado, ou conta desativada
            (NAO_AUTENTICADO); a resposta é a mesma em todos os casos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "403":
          description: Chave do simulador apresentada em rota de conta (ACESSO_NEGADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "503":
          description: Banco indisponível (DEPENDENCIA_INDISPONIVEL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão do token enviado
      description: As outras sessões da mesma conta continuam válidas. Repetir com o mesmo token devolve 401.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sessão encerrada; o token deixa de valer imediatamente
        "401":
          description: Sessão ausente, expirada ou já encerrada (NAO_AUTENTICADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "403":
          description: Chave do simulador apresentada em rota de conta (ACESSO_NEGADO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
        "503":
          description: Banco indisponível (DEPENDENCIA_INDISPONIVEL)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
  /protocolos:
    get:
      tags: [Serviços]
      summary: Serviços (protocolos acadêmicos fictícios) ativos que a paciente pode escolher (RC-07)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Serviços ativos; `itens` vazio quando não há nenhum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaProtocolos"
              example:
                itens:
                - protocoloId: PROTOCOLO-ACADEMICO-FICTICIO-v0.1
                  identificador: PROTOCOLO-ACADEMICO-FICTICIO
                  versao: v0.1
                  localidade: Município Exemplo
                  especialidade: Consulta ambulatorial em cardiologia
                  avisoFicticio: Documento acadêmico fictício. Não é exigência oficial de nenhum serviço de saúde ou do SUS.
                  simulacao: true
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes:
    get:
      tags: [Pedidos]
      summary: Lista os pedidos da paciente da sessão (RC-07)
      description: Só os pedidos próprios, do mais recente ao mais antigo, no máximo 50 (sem paginação).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pedidos da paciente; `itens` vazio se não tiver nenhum
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListaSolicitacoes"
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    post:
      tags: [Pedidos]
      summary: Cria um rascunho ligado ao serviço escolhido (RC-07)
      description: >
        A paciente é a da sessão; campos extras (dono, estado, revisão) são ignorados. Cada chamada
        bem-sucedida cria um pedido novo (sem deduplicação).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitacaoRequest"
            example:
              protocoloId: PROTOCOLO-ACADEMICO-FICTICIO-v0.1
      responses:
        "201":
          description: Rascunho criado na revisão 1
          headers:
            Location:
              schema: { type: string, example: /solicitacoes/12 }
              example:
                id: '1'
                protocoloId: PROTOCOLO-ACADEMICO-FICTICIO-v0.1
                servico:
                  localidade: Município Exemplo
                  especialidade: Consulta ambulatorial em cardiologia
                  avisoFicticio: Documento acadêmico fictício. Não é exigência oficial de nenhum serviço de saúde ou do SUS.
                estado: RASCUNHO
                revisao: 1
                criadaEm: '2026-11-12T20:00:00Z'
                atualizadaEm: '2026-11-12T20:00:00Z'
                simulacao: true
                versaoConjuntoDocumental: 1
                documentosDisponiveis: 0
                analise:
                  situacao: NAO_REALIZADA
                  mensagem: Nenhuma análise foi realizada para esta versão dos documentos.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitacao"
        "400":
          description: Corpo ou `protocoloId` inválido (REQUISICAO_INVALIDA, com `detalhes[].campo`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example:
                codigo: REQUISICAO_INVALIDA
                mensagem: Verifique os campos informados.
                detalhes:
                - campo: protocoloId
                  mensagem: O serviço deve ser informado como texto.
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "415":
          description: Corpo que não é application/json (TIPO_NAO_SUPORTADO)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example:
                codigo: TIPO_NAO_SUPORTADO
                mensagem: Envie o corpo como application/json.
        "422":
          description: Serviço inexistente ou inativo (REGRA_DE_NEGOCIO, campo `protocoloId`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example:
                codigo: REGRA_DE_NEGOCIO
                mensagem: Verifique os campos informados.
                detalhes:
                - campo: protocoloId
                  mensagem: Escolha um dos serviços da lista.
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Número decimal positivo devolvido pela criação; outro formato responde 404.
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    get:
      tags: [Pedidos]
      summary: Reabre um pedido próprio (RC-07)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Dados persistidos do pedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitacao"
              example:
                id: '1'
                protocoloId: PROTOCOLO-ACADEMICO-FICTICIO-v0.1
                servico:
                  localidade: Município Exemplo
                  especialidade: Consulta ambulatorial em cardiologia
                  avisoFicticio: Documento acadêmico fictício. Não é exigência oficial de nenhum serviço de saúde ou do SUS.
                estado: RASCUNHO
                revisao: 1
                criadaEm: '2026-11-12T20:00:00Z'
                atualizadaEm: '2026-11-12T20:00:00Z'
                simulacao: true
                versaoConjuntoDocumental: 1
                documentosDisponiveis: 0
                analise:
                  situacao: NAO_REALIZADA
                  mensagem: Nenhuma análise foi realizada para esta versão dos documentos.
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    put:
      tags: [Pedidos]
      summary: Troca o serviço de um rascunho (RC-07)
      description: >
        Só em RASCUNHO. Serviço diferente: revisão +1, `atualizadaEm` atualizado e revisão registrada com o
        motivo PROTOCOLO_ALTERADO. Mesmo serviço: 200 sem alterar nada. A dona é conferida antes do corpo.
        Alterações simultâneas do mesmo rascunho são serializadas.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitacaoRequest"
            example:
              protocoloId: PROTOCOLO-ACADEMICO-FICTICIO-v0.1
      responses:
        "200":
          description: Pedido no estado final
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Solicitacao"
        "400":
          description: Corpo ou `protocoloId` inválido (REQUISICAO_INVALIDA)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: O pedido já saiu de RASCUNHO (CONFLITO_ESTADO)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example:
                codigo: CONFLITO_ESTADO
                mensagem: Este pedido não pode mais ser alterado.
        "415":
          description: Corpo que não é application/json (TIPO_NAO_SUPORTADO)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: Serviço inexistente ou inativo (REGRA_DE_NEGOCIO, campo `protocoloId`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    delete:
      tags: [Pedidos]
      summary: Exclui um rascunho próprio, com confirmação explícita (RC-09)
      description: >
        Exige o cabeçalho `X-Confirmar-Exclusao: EXCLUIR` (valor exato). Sem ele, ou com outro valor, responde 400
        (detalhe `confirmacao`) e nada é apagado. Só em RASCUNHO. Numa única transação apaga os documentos
        (disponíveis e removidos), as revisões e o pedido; os arquivos guardados são apagados depois do commit. Ordem:
        dona (404), confirmação (400), estado (409). Não há lixeira nem desfazer.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Confirmar-Exclusao
          in: header
          required: true
          description: Confirmação deliberada da exclusão irreversível; o único valor aceito é `EXCLUIR`.
          schema: { type: string, enum: [EXCLUIR] }
      responses:
        "204":
          description: Pedido, revisões, documentos e arquivos apagados (sem corpo)
        "400":
          description: Confirmação ausente, em branco ou diferente de `EXCLUIR` (REQUISICAO_INVALIDA, campo `confirmacao`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example:
                codigo: REQUISICAO_INVALIDA
                mensagem: A exclusão precisa ser confirmada.
                detalhes:
                - campo: confirmacao
                  mensagem: Envie o cabeçalho X-Confirmar-Exclusao com o valor EXCLUIR para confirmar a exclusão.
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: >
            CONFLITO_ESTADO: pedido submetido em simulação ("Este pedido já foi submetido e só pode ser consultado."),
            pedido fora de RASCUNHO ("Somente rascunhos podem ser excluídos.") ou algo ainda ligado ao pedido
            ("Este pedido não pode ser excluído."); nada é apagado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example:
                codigo: CONFLITO_ESTADO
                mensagem: Somente rascunhos podem ser excluídos.
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}/documentos:
    parameters:
      - name: id
        in: path
        required: true
        description: Número decimal positivo do pedido; outro formato responde 404.
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    get:
      tags: [Documentos]
      summary: Lista os documentos disponíveis do pedido próprio (RC-08)
      description: Na ordem de envio, no máximo 3. Lista vazia é 200.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documentos do pedido
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListaDocumentos" }
              example:
                documentos:
                - id: '1'
                  solicitacaoId: '1'
                  nomeArquivo: encaminhamento-sintetico.pdf
                  tipoDocumental: ENCAMINHAMENTO
                  formato: PDF
                  tamanhoBytes: 999
                  paginas: 1
                  estadoEnvio: ENVIADO
                  revisaoEntrada: 2
                  enviadoEm: '2026-11-12T20:00:00Z'
                  simulacao: true
                total: 1
                maximo: 3
                versaoConjuntoDocumental: 2
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    post:
      tags: [Documentos]
      summary: Envia um arquivo ao pedido (RC-08; inclusão após a análise desde a RC-16)
      description: >
        Um arquivo por requisição, em qualquer estado exceto SUBMETIDA_SIMULACAO (RC-16: o documento que faltava pode
        ser incluído depois da análise). O formato é decidido pelo conteúdo (PDF, JPEG ou PNG), nunca pela extensão ou
        pelo tipo declarado. Cada envio novo cria a revisão seguinte (motivo DOCUMENTO_ENVIADO), torna não vigente a
        análise vigente (histórico preservado), não muda o estado e não inicia leitura nem análise. Com `X-Chave-Envio`, repetir o mesmo envio (mesmo conteúdo e tipo documental) devolve o
        documento existente com 200, sem gravar nada. Recusa não persiste nada. A dona é conferida antes do corpo.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Chave-Envio
          in: header
          required: false
          description: Identificação da tentativa, 8 a 64 caracteres [A-Za-z0-9_-]; válida por pedido.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, tipoDocumental]
              properties:
                arquivo: { type: string, format: binary, description: "PDF (até 5 páginas), JPEG ou PNG, até 5 MB" }
                tipoDocumental: { $ref: "#/components/schemas/TipoDocumental" }
      responses:
        "200":
          description: Repetição da mesma tentativa; documento já existente (nada novo foi gravado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoEnviado" }
        "201":
          description: Documento novo gravado, revisão do pedido incrementada
          headers:
            Location:
              schema: { type: string, example: /solicitacoes/12/documentos/41 }
              example:
                id: '1'
                solicitacaoId: '1'
                nomeArquivo: encaminhamento-sintetico.pdf
                tipoDocumental: ENCAMINHAMENTO
                formato: PDF
                tamanhoBytes: 999
                paginas: 1
                estadoEnvio: ENVIADO
                revisaoEntrada: 2
                enviadoEm: '2026-11-12T20:00:00Z'
                simulacao: true
                versaoConjuntoDocumental: 2
                documentosDisponiveis: 1
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoEnviado" }
        "400":
          description: >
            REQUISICAO_INVALIDA com `detalhes[].campo` = tipoDocumental, arquivo, arquivos ou chaveEnvio; PDF com mais
            de 5 páginas, protegido por senha ou ilegível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: CONFLITO_ESTADO (pedido em SUBMETIDA_SIMULACAO, só consulta) ou CHAVE_ENVIO_REUTILIZADA (mesma chave com outro conteúdo ou tipo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "413":
          description: ARQUIVO_MUITO_GRANDE (acima de 5 MB)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example:
                codigo: ARQUIVO_MUITO_GRANDE
                mensagem: O arquivo excede 5 MB.
        "415":
          description: TIPO_NAO_SUPORTADO (corpo que não é multipart/form-data ou conteúdo que não é PDF/JPEG/PNG) ou EXTENSAO_INCOMPATIVEL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example:
                codigo: TIPO_NAO_SUPORTADO
                mensagem: Envie um arquivo PDF, JPEG ou PNG.
        "422":
          description: REGRA_DE_NEGOCIO, campo `documentos` (o pedido já tem 3 documentos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}/documentos/{docId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
      - name: docId
        in: path
        required: true
        description: Número decimal positivo devolvido pelo envio; só abre pelo pedido ao qual pertence.
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    get:
      tags: [Documentos]
      summary: Baixa o arquivo de um documento próprio, como anexo (RC-08)
      description: >
        Conteúdo exatamente como foi guardado. Documento alheio, de outro pedido, inexistente ou id mal formado:
        o mesmo 404. O nome interno de armazenamento nunca aparece.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Arquivo
          headers:
            Content-Disposition:
              schema: { type: string, example: 'attachment; filename="encaminhamento.pdf"' }
            X-Content-Type-Options:
              schema: { type: string, example: nosniff }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    put:
      tags: [Documentos]
      summary: Substitui um documento por outro arquivo, numa só operação (RC-09)
      description: >
        Mesmo multipart do envio (`arquivo`, `tipoDocumental`, `X-Chave-Envio` opcional). O documento antigo sai e o
        novo entra na mesma transação, com UMA revisão nova (motivo DOCUMENTO_SUBSTITUIDO); a contagem de documentos
        não muda, então não há erro de limite. O arquivo novo passa pela conferência do envio; recusa ou falha deixa o
        antigo, a versão e os arquivos como estavam. O arquivo antigo é apagado depois do commit. Com `X-Chave-Envio`, a
        repetição é reconhecida ANTES de procurar o `docId` (que, depois do sucesso, já não existe) e responde 200.
        Não inicia análise nem muda o estado; torna não vigente a análise anterior. Pedido em SUBMETIDA_SIMULACAO: 409.
      security:
        - bearerAuth: []
      parameters:
        - name: X-Chave-Envio
          in: header
          required: false
          description: Identificação da tentativa, 8 a 64 caracteres [A-Za-z0-9_-]; vale por pedido, para POST e PUT.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{8,64}$" }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [arquivo, tipoDocumental]
              properties:
                arquivo: { type: string, format: binary, description: "PDF (até 5 páginas), JPEG ou PNG, até 5 MB" }
                tipoDocumental: { $ref: "#/components/schemas/TipoDocumental" }
      responses:
        "200":
          description: Repetição da mesma tentativa; documento já existente (nada novo foi gravado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoEnviado" }
        "201":
          description: Documento novo no lugar do antigo; `Location` aponta para o documento NOVO
          headers:
            Location:
              schema: { type: string, example: /solicitacoes/12/documentos/42 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DocumentoEnviado" }
        "400":
          description: >
            REQUISICAO_INVALIDA com `detalhes[].campo` = tipoDocumental, arquivo, arquivos ou chaveEnvio; PDF com mais
            de 5 páginas, protegido por senha ou ilegível
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: >
            CONFLITO_ESTADO (pedido submetido em simulação: "Este pedido já foi submetido e só pode ser consultado.") ou
            CHAVE_ENVIO_REUTILIZADA (mesma chave com outro conteúdo ou tipo)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "413":
          description: ARQUIVO_MUITO_GRANDE (acima de 5 MB)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "415":
          description: TIPO_NAO_SUPORTADO (corpo que não é multipart/form-data ou conteúdo que não é PDF/JPEG/PNG) ou EXTENSAO_INCOMPATIVEL
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    delete:
      tags: [Documentos]
      summary: Remove um documento do pedido próprio (RC-09)
      description: >
        Sem corpo. Revisão +1 (motivo DOCUMENTO_REMOVIDO); o documento some da lista e do download, a vaga é liberada e o
        arquivo é apagado depois do commit; o registro fica como histórico. Repetir a remoção é 404 e não muda versão
        nem contagem. Não inicia análise nem muda o estado; torna não vigente a análise anterior. Pedido em
        SUBMETIDA_SIMULACAO: 409.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Documento removido; estado novo do conjunto documental
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemocaoDocumento" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: CONFLITO_ESTADO (pedido submetido em simulação; só pode ser consultado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}/extracoes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    post:
      tags: [Leitura simulada]
      summary: Lê os documentos do pedido próprio (leitura SIMULADA, RC-10)
      description: >
        Lê os documentos disponíveis da versão atual do conjunto documental e guarda o resultado. A leitura é
        simulada (dados sintéticos predefinidos; o sistema não lê o arquivo de verdade) e toda resposta traz
        simulada true. Sem corpo. Repetir sobre a mesma versão devolve a leitura existente (200). Não muda o
        estado do pedido, não cria revisão, não inicia análise nem produz resultado de completude. Ordem: 401,
        403, 404, 409 (submetido, mesmo com leitura existente), 422, 200 (já existe), leitura, 409 (documentos
        mudaram durante a leitura), 503.
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Leitura nova gravada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extracao" }
              example:
                id: '1'
                situacao: ATUAL
                versaoConjuntoDocumental: 2
                simulada: true
                aviso: Leitura simulada com dados sintéticos; não é leitura real dos documentos.
                criadaEm: '2026-11-12T20:00:00Z'
                documentos:
                - documentoId: '1'
                  tipoDocumental: ENCAMINHAMENTO
                  situacao: LIDO
                  campos:
                  - codigo: TIPO_DOCUMENTO
                    situacao: IDENTIFICADO
                    valor: ENCAMINHAMENTO
                    origem:
                      pagina: 1
                      trecho: ENCAMINHAMENTO PARA CONSULTA AMBULATORIAL
                  - codigo: NOME
                    situacao: IDENTIFICADO
                    valor: Maria Exemplo da Silva
                    origem:
                      pagina: 1
                      trecho: 'Paciente: Maria Exemplo da Silva'
                  - codigo: DATA_NASCIMENTO
                    situacao: IDENTIFICADO
                    valor: '1990-04-12'
                    origem:
                      pagina: 1
                      trecho: 'Nascimento: 12/04/1990'
                  - codigo: MOTIVO_ENCAMINHAMENTO
                    situacao: IDENTIFICADO
                    valor: Avaliacao cardiologica ambulatorial (texto sintetico)
                    origem:
                      pagina: 1
                      trecho: 'Motivo: Avaliacao cardiologica ambulatorial (texto sintetico)'
                  - codigo: DATA_EMISSAO
                    situacao: IDENTIFICADO
                    valor: '2026-10-20'
                    origem:
                      pagina: 1
                      trecho: 'Emissao: 20/10/2026'
                  - codigo: AUTORIZACAO_ASSINADA
                    situacao: NAO_LOCALIZADO
        "200":
          description: Já existia leitura para a versão atual; nada novo foi gravado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extracao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "409":
          description: CONFLITO_ESTADO (pedido submetido em simulação; ou os documentos mudaram durante a leitura)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
        "422":
          description: SEM_DOCUMENTOS (o pedido não tem documento disponível; nada é criado)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
              example:
                codigo: SEM_DOCUMENTOS
                mensagem: Este pedido ainda não tem documentos para ler. Envie um documento primeiro.
        "503":
          description: LEITURA_INDISPONIVEL (o leitor falhou ou respondeu fora do contrato; nada é gravado; pode tentar de novo) ou DEPENDENCIA_INDISPONIVEL (banco ou área de arquivos)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Erro" }
    get:
      tags: [Leitura simulada]
      summary: Consulta a leitura mais recente do pedido próprio (RC-10)
      description: >
        Devolve a leitura mais recente, ATUAL (feita na versão atual dos documentos) ou DESATUALIZADA (depois de
        enviar, remover ou substituir documento). Pedido alheio, inexistente ou sem nenhuma leitura: o mesmo 404.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Leitura mais recente
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Extracao" }
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
  /solicitacoes/{id}/extracoes/{extracaoId}/conferencia:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
      - name: extracaoId
        in: path
        required: true
        description: Identificador da leitura (campo id devolvido por /extracoes)
        schema: { type: string, pattern: "^[1-9][0-9]{0,17}$" }
    get:
      tags: [Conferência]
      summary: Consulta a conferência da transcrição de uma leitura do pedido próprio (RC-11)
      description: >
        Mostra o que foi lido (SIMULADO), com a origem, destacando os campos não verificados, as decisões da paciente,
        orientações fixas e a situação calculada. Leitura desatualizada (depois de enviar, remover ou substituir
        documento) é devolvida como DESATUALIZADA, somente leitura. liberadoParaSubmissao é sempre false. Pedido ou
        leitura inexistente, alheio, de outro pedido ou id mal formado: o mesmo 404. Não muda estado nem revisão.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Conferência da leitura
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conferencia" }
              example:
                extracaoId: '1'
                situacao: PENDENTE
                liberadoParaSubmissao: false
                simulada: true
                aviso: Leitura simulada com dados sintéticos; não é leitura real dos documentos.
                atualizadaEm: '2026-11-12T20:00:00Z'
                resumo:
                  camposNaoVerificados: 1
                  camposSemDecisao: 5
                  divergencias: 0
                documentos:
                - documentoId: '1'
                  tipoDocumental: ENCAMINHAMENTO
                  situacao: LIDO
                  campos:
                  - codigo: TIPO_DOCUMENTO
                    situacao: IDENTIFICADO
                    valor: ENCAMINHAMENTO
                    origem:
                      pagina: 1
                      trecho: ENCAMINHAMENTO PARA CONSULTA AMBULATORIAL
                    naoVerificado: false
                  - codigo: NOME
                    situacao: IDENTIFICADO
                    valor: Maria Exemplo da Silva
                    origem:
                      pagina: 1
                      trecho: 'Paciente: Maria Exemplo da Silva'
                    naoVerificado: false
                  - codigo: DATA_NASCIMENTO
                    situacao: IDENTIFICADO
                    valor: '1990-04-12'
                    origem:
                      pagina: 1
                      trecho: 'Nascimento: 12/04/1990'
                    naoVerificado: false
                  - codigo: MOTIVO_ENCAMINHAMENTO
                    situacao: IDENTIFICADO
                    valor: Avaliacao cardiologica ambulatorial (texto sintetico)
                    origem:
                      pagina: 1
                      trecho: 'Motivo: Avaliacao cardiologica ambulatorial (texto sintetico)'
                    naoVerificado: false
                  - codigo: DATA_EMISSAO
                    situacao: IDENTIFICADO
                    valor: '2026-10-20'
                    origem:
                      pagina: 1
                      trecho: 'Emissao: 20/10/2026'
                    naoVerificado: false
                  - codigo: AUTORIZACAO_ASSINADA
                    situacao: NAO_LOCALIZADO
                    naoVerificado: true
                    orientacao: Esta informação não consta no documento lido. Se ela for necessária, peça um documento corrigido
                      à unidade emissora. Não é possível preencher aqui.
        "401": { $ref: "#/components/responses/NaoAutenticado" }
        "403": { $ref: "#/components/responses/AcessoNegado" }
        "404": { $ref: "#/components/responses/NaoEncontrado" }
        "503": { $ref: "#/components/responses/Indisponivel" }
    put:
      tags: [Conferência]
      summary: Registra as decisões da paciente sobre os campos lidos (RC-11)
      description: >
        A paciente só confirma ou marca divergência, campo a campo; nenhum valor digitado é aceito (qualquer chave
        além de documentoId, codigo, decisao e motivo é 400). De 1 a 18 decisões; lote tudo ou nada; decidir de novo
        substitui a decisão vigente e repetir a mesma não muda nada. Não muda o estado nem a revisão do pedido e nunca
        libera submissão. Ordem: 401, 403, 404 (pedido e leitura, antes de ler o corpo), 415/400, 409 (submetido ou
        leitura desatualizada), 404 (documento fora da leitura), 422, 503.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConferenciaRequest" }
            example:
              decisoes:
              - documentoId: '1'
                codigo: TIPO_DOCUMENTO
                decisao: CONFIRMADA
              - documentoId: '1'
                codigo: NOME
                decisao: CONFIRMADA
              - documentoId: '1'
                codigo: DATA_NASCIMENTO
                decisao: CONFIRMADA
              - documentoId: '1'
                codigo: MOTIVO_ENCAMINHAMENTO
                decisao: CONFIRMADA
              - documentoId: '1'
                codigo: DATA_EMISSAO
                decisao: CONFIRMADA
      responses:
        "200":
          description: Decisões registradas; devolve a conferência com a situação nova
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Conferencia" }
              example:
                extracaoId: '1'
                situacao: CONFERIDA
                liberadoParaSubmissao: false
                simulada: true
                aviso: Leitura simulada com dados sintéticos; não é leitura real dos documentos.
                atualizadaEm: '2026-11-12T20:00:00Z'
                resumo:
                  camposNaoVerificados: 1
                  camposSemDecisao: 0
                  divergencias: 0
                documentos:
                - documentoId: '1'
                  tipoDocumental: ENCAMINHAMENTO
                  situacao: LIDO
                  campos:
                  - codigo: TIPO_DOCUMENTO
                    situacao: IDENTIFICADO
                    valor: ENCAMINHAMENTO
                    origem:
                      pagina: 1
                      trecho: ENCAMINHAMENTO PARA CONSULTA AMBULATORIAL
                    naoVerificado: false
                    decisao:
                      tipo: CONFIRMADA
                      decididaEm: '2026-11-12T20:00:00Z'
                  - codigo: NOME
                    situacao: IDENTIFICADO
                    valor: Maria Exemplo da Silva
                    origem:
                      pagina: 1
                      trecho: 'Paciente: Maria Exemplo da Silva'
                    naoVerificado: false
                    decisao:
                      tipo: CONFIRMADA
                      decididaEm: '2026-11-12T20:00:00Z'
                  - codigo: DATA_NASCIMENTO
                    situacao: IDENTIFICADO
                    valor: '1990-04-12'
                    origem:
                      pagina: 1
                      trecho: 'Nascimento: 12/04/1990'
                    naoVerificado: false
                    decisao:
                      tipo: CONFIRMADA
                      decididaEm: '2026-11-12T20:00:00Z'
                  - codigo: MOTIVO_ENCAMINHAMENTO
                    situacao: IDENTIFICADO
                    valor: Avaliacao cardiologica ambulatorial (texto sintetico)
                    origem:
                      pagina: 1
                      trecho: 'Motivo: Avaliacao cardiologica ambulatorial (texto sintetico)'
                    naoVerificado: false
                    decisao:
                      tipo: CONFIRMADA
                      decididaEm: '2026-11-12T20:00:00Z'
                  - codigo: DATA_EMISSAO
                    situacao: IDENTIFICADO
                    valor: '2026-10-20'
                    origem:
                      pagina: 1
                      trecho: 'Emissao: 20/10/2026'
                    naoVerificado: false
                    decisao:
                      tipo: CONFIRMADA
                      decididaEm: '2026-11-12T20:00:00Z'
                  - codigo: AUTORIZACAO_ASSINADA
                    situacao: NAO_LOCALIZADO
